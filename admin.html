<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Reports</title>
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
body { background:#000; color:#fff; font-family:'Inter',sans-serif; }
</style>
</head>
<body class="min-h-screen p-4 sm:p-8">

<header class="mb-8 border-b border-gray-800 pb-4 flex justify-between items-center">
  <h1 class="text-2xl font-black text-red-500">🛡️ ReelsBook Admin</h1>
  <a href="/" class="text-sm text-gray-400 hover:text-white underline">← Back to App</a>
</header>

<main class="max-w-5xl mx-auto">

  <!-- 🛑 Login Wall -->
  <div id="loginWall" class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center max-w-md mx-auto mt-20">
    <h2 class="text-xl font-bold mb-4">Admin Access Only</h2>
    <p class="text-gray-400 mb-6 text-sm">Please sign in with your admin Google account.</p>
    <div id="googleSignInBtn" class="flex justify-center mb-4"></div>
    <p id="authStatus" class="text-sm text-red-400"></p>
  </div>

  <!-- 🛑 Reports Section (Hidden by default) -->
  <div id="reportsSection" class="hidden">
    <div class="mb-6 flex justify-between items-center">
      <h2 class="text-xl font-bold">Copyright Reports</h2>
      <button onclick="loadAdminReports()" class="bg-gray-800 hover:bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold transition">🔄 Refresh List</button>
    </div>
    <div id="reportsList" class="space-y-4"></div>
  </div>

</main>

<script>
// ⚠️ YAHAN APNI EMAIL DAALEIN (Sirf yahi email Admin banegi)
const ADMIN_EMAIL = "mansoor@example.com"; // <--- APNI GOOGLE EMAIL YAHAN LIKHEIN

let adminUser = null;

// Google Login Initialize karein
async function initAdminLogin() {
  try {
    const r = await fetch('/api/auth/config');
    const cfg = await r.json();
    if (!cfg.googleClientId) { document.getElementById('authStatus').textContent = "Google login not configured."; return; }

    google.accounts.id.initialize({
      client_id: cfg.googleClientId,
      callback: async (res) => {
        // Token verify karein backend se
        const verifyRes = await fetch('/api/auth/google', {
          method: 'POST', headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ credential: res.credential })
        });
        const data = await verifyRes.json();

        if (verifyRes.ok) {
          if (data.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
            // ✅ Email match ho gayi! Admin panel kholo
            adminUser = data;
            document.getElementById('loginWall').classList.add('hidden');
            document.getElementById('reportsSection').classList.remove('hidden');
            loadAdminReports();
          } else {
            // ❌ Email match nahi hui (Koi aur banda hai)
            document.getElementById('authStatus').textContent = "Access Denied. You are not the admin.";
          }
        } else {
          document.getElementById('authStatus').textContent = "Verification failed.";
        }
      }
    });

    google.accounts.id.renderButton(document.getElementById('googleSignInBtn'), {
      theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill'
    });
  } catch {
    document.getElementById('authStatus').textContent = "Error loading Google login.";
  }
}

// Reports Load karo
async function loadAdminReports() {
  const list = document.getElementById('reportsList');
  list.innerHTML = '<p class="text-gray-500 text-center py-10">Loading reports...</p>';

  try {
    const res = await fetch('/api/admin/reports');
    const reports = await res.json();

    if (!reports.length) {
      list.innerHTML = '<div class="bg-gray-900 border border-gray-800 rounded-xl p-8 text-center"><p class="text-gray-400">Mubarak ho! Koi report pending nahi hai.</p></div>';
      return;
    }

    list.innerHTML = '';
    reports.forEach(r => {
      const date = new Date(r.created_at).toLocaleString();
      const isPending = r.status === 'pending';
      
      const card = document.createElement('div');
      card.className = 'bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col md:flex-row justify-between items-start md:items-center gap-4';
      
      card.innerHTML = `
        <div class="flex-1">
          <div class="flex items-center gap-2 mb-2">
            <span class="px-2 py-1 rounded text-xs font-bold ${isPending ? 'bg-yellow-500/20 text-yellow-500' : 'bg-green-500/20 text-green-500'}">${r.status.toUpperCase()}</span>
            <span class="text-gray-500 text-xs">${date}</span>
          </div>
          <p class="text-lg font-bold text-red-400 mb-1">${r.reason}</p>
          <p class="text-sm text-gray-300 mb-2">Reported By: <span class="font-semibold text-white">${r.reporter_name}</span> (${r.reporter_email || 'No email'})</p>
          <a href="${r.media_url}" target="_blank" class="text-sm text-blue-400 underline hover:text-blue-300">🔗 View Reported Video</a>
        </div>
        <div class="flex gap-2 shrink-0 w-full md:w-auto">
          ${isPending ? `
            <button onclick="deleteReportedVideo('${r.media_id}', '${r.id}')" class="flex-1 md:flex-none bg-red-600 hover:bg-red-700 px-4 py-2 rounded-lg text-sm font-bold transition">Delete Video</button>
            <button onclick="rejectReport('${r.id}')" class="flex-1 md:flex-none bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded-lg text-sm font-bold transition">Reject</button>
          ` : `<p class="text-sm text-gray-500 italic">Action already taken.</p>`}
        </div>
      `;
      list.appendChild(card);
    });
  } catch (err) {
    list.innerHTML = '<p class="text-red-500 text-center py-10">Error loading reports.</p>';
  }
}

async function deleteReportedVideo(mediaId, reportId) {
  if (!adminUser) return alert('Login required');
  if (!confirm('⚠️ Delete this video permanently from R2?')) return;
  
  try {
    const res = await fetch('/api/admin/delete-video', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ mediaId, reportId })
    });
    if (res.ok) { alert('✅ Video Deleted.'); loadAdminReports(); }
    else { alert('❌ Error deleting video.'); }
  } catch { alert('Network error.'); }
}

async function rejectReport(reportId) {
  if (!adminUser) return alert('Login required');
  if (!confirm('Reject this report? Video will stay.')) return;
  
  try {
    const res = await fetch('/api/admin/reject-report', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ reportId })
    });
    if (res.ok) { alert('✅ Report Rejected.'); loadAdminReports(); }
  } catch { alert('Network error.'); }
}

// Sab shuru karo
initAdminLogin();
</script>
</body>
</html>
