<!doctype html>
<html lang="en">

<head>
  <meta name="google-site-verification" content="DYeiTw87ZycZvB0GuDitM6o21FIz2b1f_7hce86Smls" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  
  <!-- PWA SETUP START -->
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- PWA SETUP END -->

  <title>ReelsBook — Modern Social Platform</title>
  
  <!-- Google Fonts for ReelsBook Logo -->
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  
  <style>
    /* Original Styles Preserved */
    .token-border { border-color: color-mix(in srgb, var(--color-text) 12%, transparent); }
    .token-border-soft { border-color: color-mix(in srgb, var(--color-text) 8%, transparent); }
    .token-panel { background: color-mix(in srgb, var(--color-surface) 92%, transparent); }
    .token-overlay { background: color-mix(in srgb, var(--color-bg) 78%, transparent); }
    .media-card img, .media-card video { background: var(--color-bg); }
    .like-button[aria-pressed="true"] { color: var(--color-primary); border-color: var(--color-primary); }
    .upload-zone.is-dragging { border-color: var(--color-primary); background: color-mix(in srgb, var(--color-primary) 9%, transparent); }
    #upload { display: none; position: fixed; z-index: 45; right: 1rem; bottom: 6rem; left: 1rem; max-height: calc(100svh - 8rem); overflow-y: auto; box-shadow: 0 24px 80px rgba(var(--color-bg-rgb), .7); }
    #upload.is-open { display: block; }
    .reels-feed { display: grid; gap: 1rem; max-height: min(78svh, 52rem); overflow-y: auto; overscroll-behavior: contain; scroll-snap-type: y mandatory; scrollbar-width: thin; scrollbar-color: var(--color-primary) var(--color-surface); }
    .reel-card { position: relative; min-height: 32rem; height: min(78svh, 52rem); overflow: hidden; scroll-snap-align: start; background: var(--color-surface); }
    .reel-card video { width: 100%; height: 100%; object-fit: cover; background: var(--color-bg); }
    .reel-details { position: absolute; right: 0; bottom: 0; left: 0; padding: 5rem 1.25rem 1.25rem; background: linear-gradient(transparent, rgba(var(--color-bg-rgb), .88)); }
    .bottom-dock { padding-bottom: max(.75rem, env(safe-area-inset-bottom)); }
    @media (max-width: 640px) { .reels-feed { max-height: 72svh; } .reel-card { min-height: 28rem; height: 72svh; } }

    /* New Design Specific Styles */
    body { background-color: #000000; color: #ffffff; font-family: 'Inter', sans-serif; padding-bottom: 70px; }
    .font-logo { font-family: 'Pacifico', cursive; letter-spacing: 0.5px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 2px; border-radius: 50%; display: inline-block; }
    .story-ring-inner { border: 2px solid #000; border-radius: 50%; padding: 2px; background: #000; overflow: hidden; width: 60px; height: 60px; }
    .post-card { background: #000; border-bottom: 1px solid #27272a; padding-bottom: 1rem; margin-bottom: 1rem; }
    .post-media { width: 100%; max-height: 600px; object-fit: cover; background: #000; }
  </style>
</head>

<body class="antialiased">
  <div class="noise fixed inset-0 z-50 pointer-events-none"></div>

  <!-- 1. HEADER (Updated) -->
  <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b border-gray-800 px-4 py-3 flex items-center justify-between">
    <a href="/" class="text-2xl font-logo text-white" aria-label="ReelsBook home">ReelsBook</a>
    <div class="flex items-center gap-5">
      <button id="toggleUploadTop" class="text-white hover:text-pink-500 transition" aria-label="Create Post">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
      <button class="text-white hover:text-pink-500 transition" aria-label="Notifications">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
      </button>
      <button id="accountButton" type="button" class="rounded-full border border-gray-700 px-3 py-1.5 text-sm font-semibold transition hover:border-pink-500 hover:text-pink-500">Log in</button>
    </div>
  </header>

  <!-- Account Dialog Preserved -->
  <div id="accountDialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 px-5 backdrop-blur-sm" role="dialog" aria-modal="true">
    <section class="relative w-full max-w-md rounded-2xl border border-gray-800 bg-gray-900 p-6 shadow-2xl sm:p-8">
      <button id="closeAccountDialog" type="button" class="absolute right-4 top-4 text-gray-400 hover:text-white" aria-label="Close">×</button>
      <p class="mb-3 text-xs font-bold uppercase tracking-[.2em] text-pink-500">Your account</p>
      <h2 class="pr-8 text-2xl font-black tracking-tight text-white">Welcome to the wall</h2>
      <div class="mt-7 grid gap-3">
        <div id="googleContinueButton" class="flex justify-center"></div>
        <div id="googleSignupButton" class="flex justify-center"></div>
      </div>
      <p id="accountDialogStatus" class="mt-4 text-center text-sm text-gray-400" aria-live="polite"></p>
    </section>
  </div>

  <main class="relative z-10 mx-auto max-w-7xl px-0 sm:px-5 lg:px-10 pb-20">
    
    <!-- 2. STORIES SECTION (New) -->
    <section class="mb-2 border-b border-gray-800 pb-4 pt-4 px-4 sm:px-0">
      <div class="flex gap-4 overflow-x-auto hide-scrollbar max-w-xl mx-auto">
        <!-- Current User Add Story -->
        <div class="flex flex-col items-center gap-1 cursor-pointer shrink-0" id="addStoryBtn">
          <div class="relative w-[60px] h-[60px] rounded-full border border-gray-700 bg-gray-800 flex items-center justify-center">
            <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full p-0.5 border-2 border-black">
              <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </div>
          </div>
          <span class="text-xs text-gray-400">Your Story</span>
        </div>
        <!-- Real Stories Container -->
        <div id="storiesContainer" class="flex gap-4">
          <!-- JS will inject real stories here -->
        </div>
      </div>
    </section>

    <!-- Upload Section Preserved (but hidden mostly until clicked) -->
    <section id="upload" class="scroll-mt-8 rounded-2xl border border-gray-800 bg-gray-900 p-3 sm:p-4 mx-4 sm:mx-0 max-w-xl lg:mx-auto mt-4">
      <button id="toggleUpload" type="button" class="flex w-full items-center justify-center gap-3 rounded-2xl px-4 py-3 text-sm font-bold transition hover:bg-pink-500/10" aria-expanded="false" aria-controls="uploadOptions">
        <span class="flex h-9 w-9 items-center justify-center rounded-full bg-pink-500 text-2xl leading-none text-white" aria-hidden="true">+</span>
        <span>Share a moment</span>
      </button>
      <div id="uploadOptions" class="mt-5 hidden">
      <div class="mb-6 flex flex-col gap-3 rounded-2xl border border-gray-800 bg-black p-4 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p id="authStatus" class="font-semibold text-white">Sign in to upload.</p>
          <p id="authAccount" class="mt-1 text-sm text-gray-400" aria-live="polite"></p>
        </div>
        <div class="flex shrink-0 items-center gap-3">
          <div id="googleSignInButton"></div>
          <button id="signOutButton" type="button" class="hidden rounded-full border border-gray-700 px-4 py-2 text-sm font-semibold transition hover:border-pink-500 text-white">Sign out</button>
        </div>
      </div>
      <div class="mb-4 grid grid-cols-3 gap-3" role="group" aria-label="Choose upload type">
        <button type="button" class="upload-type-option rounded-xl border border-gray-700 bg-pink-500 px-4 py-3 text-sm font-bold text-white transition" data-upload-type="photo" aria-pressed="true">📷 Photo</button>
        <button type="button" class="upload-type-option rounded-xl border border-gray-700 bg-gray-800 px-4 py-3 text-sm font-bold text-white transition hover:border-pink-500" data-upload-type="video" aria-pressed="false">▶ Video</button>
        <button type="button" class="upload-type-option rounded-xl border border-gray-700 bg-gray-800 px-4 py-3 text-sm font-bold text-white transition hover:border-pink-500" data-upload-type="gif" aria-pressed="false">✨ GIF</button>
      </div>
      <label id="dropZone" class="upload-zone group flex min-h-48 cursor-pointer flex-col items-center justify-center rounded-xl border border-dashed border-gray-700 px-6 text-center transition hover:border-pink-500 hover:bg-black">
        <input id="mediaInput" type="file" accept="image/jpeg,image/png,image/webp,image/avif" class="sr-only">
        <span class="mb-3 flex h-12 w-12 items-center justify-center rounded-full bg-pink-500 text-2xl text-white">↑</span>
        <span id="dropTitle" class="text-lg font-bold text-white">Drag &amp; drop a photo here</span>
        <span id="dropHint" class="mt-2 text-sm text-gray-400">or click to browse · up to 90 MB</span>
      </label>

      <div id="filePanel" class="mt-5 hidden rounded-xl border border-gray-800 bg-black p-5">
        <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
          <div class="flex min-w-0 items-center gap-4">
            <div id="fileTypeIcon" class="flex h-12 w-12 shrink-0 items-center justify-center rounded-xl bg-pink-500/15 text-xl text-pink-500">✦</div>
            <div class="min-w-0">
              <p id="fileName" class="truncate font-bold text-white"></p>
              <p id="fileSize" class="mt-1 text-sm text-gray-400"></p>
            </div>
          </div>
          <button id="clearFile" type="button" class="text-sm text-gray-400 underline hover:text-white">Remove</button>
        </div>
        <div class="mt-5 grid gap-3 sm:grid-cols-[1fr_auto]">
          <input id="mediaTitle" class="rounded-xl border border-gray-700 bg-gray-900 px-4 py-3 text-sm text-white outline-none focus:border-pink-500" placeholder="Give it a title">
          <button id="publishButton" type="button" class="rounded-xl bg-pink-500 px-5 py-3 font-bold text-white transition hover:brightness-110">Publish</button>
        </div>
        <p id="uploadStatus" class="mt-4 hidden text-sm text-pink-500" role="status" aria-live="polite"></p>
      </div>
      </div>
    </section>

    <!-- 3. POSTS FEED (Wall) -->
    <section id="wall" class="scroll-mt-8 pt-4">
      <!-- Filter preserved but hidden on mobile for cleaner look -->
      <div class="hidden sm:flex mb-4 items-center justify-between px-4 max-w-xl mx-auto">
        <h2 class="text-xl font-bold text-white">Posts</h2>
        <div class="flex items-center gap-3">
          <select id="mediaFilter" class="rounded-full border border-gray-700 bg-gray-900 px-4 py-2 text-sm text-white outline-none focus:border-pink-500">
            <option value="all">All media</option>
            <option value="photo">Photos</option>
            <option value="video">Videos</option>
          </select>
          <span id="countLabel" class="rounded-full bg-gray-800 px-3 py-1.5 text-xs text-gray-400">Loading</span>
        </div>
      </div>
      
      <!-- Ye raha aapka mediaGrid, bas ab isme post-card render hoga -->
      <div id="mediaGrid" class="max-w-xl mx-auto flex flex-col"></div>
      
      <p id="wallStatus" class="mt-5 text-center text-sm text-gray-400" role="status" aria-live="polite"></p>
    </section>

    <!-- Reels Section Preserved -->
    <section id="reels" class="scroll-mt-8 pt-12 px-4 sm:px-0">
      <div class="mb-8 max-w-xl mx-auto">
        <h2 class="text-2xl font-bold text-white">Reels</h2>
      </div>
      <div id="reelsFeed" class="reels-feed mx-auto max-w-md" aria-label="Video reels"></div>
      <p id="reelsStatus" class="mt-5 text-center text-sm text-gray-400" role="status" aria-live="polite"></p>
    </section>
  </main>

  <!-- 4. BOTTOM NAVIGATION (New) -->
  <nav class="fixed bottom-0 inset-x-0 z-40 bg-black border-t border-gray-800 flex justify-around items-center py-2 pb-safe">
    <a href="#wall" id="navHome" class="text-white flex flex-col items-center gap-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px]">Home</span>
    </a>
    <button class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <span class="text-[10px]">Search</span>
    </button>
    <button id="bottomPlus" class="bg-pink-500 text-white rounded-lg p-2 hover:brightness-110 transition" aria-expanded="false">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>
    <a href="#reels" id="navReels" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span class="text-[10px]">Reels</span>
    </a>
    <a href="/profile/index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px]">Profile</span>
    </a>
  </nav>

  <script>
    // Aapka pura original JavaScript yahan hai
    const mediaInput = document.getElementById('mediaInput');
    const dropZone = document.getElementById('dropZone');
    const filePanel = document.getElementById('filePanel');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const uploadStatus = document.getElementById('uploadStatus');
    const wallStatus = document.getElementById('wallStatus');
    const mediaGrid = document.getElementById('mediaGrid');
    const reelsFeed = document.getElementById('reelsFeed');
    const reelsStatus = document.getElementById('reelsStatus');
    const countLabel = document.getElementById('countLabel');
    const authStatus = document.getElementById('authStatus');
    const authAccount = document.getElementById('authAccount');
    const googleSignInButton = document.getElementById('googleSignInButton');
    const signOutButton = document.getElementById('signOutButton');
    const accountDialog = document.getElementById('accountDialog');
    const accountDialogStatus = document.getElementById('accountDialogStatus');
    const authStorageKey = 'fullMastiGoogleCredential';
    let googleCredential = sessionStorage.getItem(authStorageKey) || '';
    let googleUser = null;
    const maxUploadSize = 90 * 1024 * 1024;
    const uploadTypes = {
      photo: { accept: 'image/jpeg,image/png,image/webp,image/avif', title: 'Drag & drop a photo here', hint: 'or click to browse · JPG, PNG, WEBP, AVIF · up to 90 MB' },
      video: { accept: 'video/mp4,video/quicktime,video/webm,video/ogg,video/x-matroska', title: 'Drag & drop a video here', hint: 'or click to browse · MP4, MOV, WEBM, OGG, MKV · up to 90 MB' },
      gif: { accept: 'image/gif', title: 'Drag & drop a GIF here', hint: 'or click to browse · GIF · up to 90 MB' }
    };
    let activeUploadType = 'photo';
    let selectedFile = null;
    let galleryItems = [];

    function getVisitorId() {
      let visitorId = localStorage.getItem('ReelsbookVisitorId') || localStorage.getItem('openframeVisitorId');
      if (!visitorId) visitorId = crypto.randomUUID();
      localStorage.setItem('ReelsbookVisitorId', visitorId);
      return visitorId;
    }
    const visitorId = getVisitorId();

    function readableSize(bytes) {
      if (bytes < 1024 * 1024) return `${Math.max(1, Math.round(bytes / 1024))} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function showUploadMessage(message) {
      uploadStatus.textContent = message;
      uploadStatus.classList.remove('hidden');
    }

    function setUploadType(type) {
      activeUploadType = type;
      const settings = uploadTypes[type];
      mediaInput.accept = settings.accept;
      document.getElementById('dropTitle').textContent = settings.title;
      document.getElementById('dropHint').textContent = settings.hint;
      document.querySelectorAll('.upload-type-option').forEach((button) => {
        const isActive = button.dataset.uploadType === type;
        button.setAttribute('aria-pressed', String(isActive));
        button.classList.toggle('bg-pink-500', isActive);
        button.classList.toggle('text-white', isActive);
        button.classList.toggle('bg-gray-800', !isActive);
        button.classList.toggle('text-white', !isActive);
      });
      selectedFile = null;
      mediaInput.value = '';
      filePanel.classList.add('hidden');
      uploadStatus.classList.add('hidden');
    }

    const toggleUpload = document.getElementById('toggleUpload');
    const uploadOptions = document.getElementById('uploadOptions');
    const bottomPlus = document.getElementById('bottomPlus');
    const uploadSection = document.getElementById('upload');
    const toggleUploadTop = document.getElementById('toggleUploadTop');

    // New Bottom Nav logic
    document.getElementById('navReels').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('wall').classList.add('hidden');
      document.getElementById('reels').classList.remove('hidden');
    });
    document.getElementById('navHome').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('reels').classList.add('hidden');
      document.getElementById('wall').classList.remove('hidden');
    });

    function openAccountDialog() {
      accountDialog.classList.remove('hidden');
      accountDialog.classList.add('flex');
      document.getElementById('closeAccountDialog').focus();
    }

    function closeAccountDialog() {
      accountDialog.classList.add('hidden');
      accountDialog.classList.remove('flex');
      document.getElementById('accountButton').focus();
    }

    document.getElementById('accountButton').addEventListener('click', openAccountDialog);
    document.getElementById('closeAccountDialog').addEventListener('click', closeAccountDialog);
    accountDialog.addEventListener('click', (event) => { if (event.target === accountDialog) closeAccountDialog(); });
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && !accountDialog.classList.contains('hidden')) closeAccountDialog(); });

    function openUpload() {
      toggleUpload.setAttribute('aria-expanded', 'true');
      bottomPlus.setAttribute('aria-expanded', 'true');
      uploadSection.classList.add('is-open');
      uploadOptions.classList.remove('hidden');
    }

    function closeUpload() {
      toggleUpload.setAttribute('aria-expanded', 'false');
      bottomPlus.setAttribute('aria-expanded', 'false');
      uploadSection.classList.remove('is-open');
      uploadOptions.classList.add('hidden');
    }

    toggleUpload.addEventListener('click', () => {
      const isExpanded = toggleUpload.getAttribute('aria-expanded') === 'true';
      if (isExpanded) closeUpload(); else openUpload();
    });

    toggleUploadTop.addEventListener('click', openUpload);
    bottomPlus.addEventListener('click', openUpload);
    document.getElementById('addStoryBtn').addEventListener('click', openUpload);
    document.getElementById('closeUpload').addEventListener('click', closeUpload);

    document.querySelectorAll('.upload-type-option').forEach((button) => {
      button.addEventListener('click', () => setUploadType(button.dataset.uploadType));
    });

    function showFile(file) {
      if (!file) return;
      const matchesSelection = activeUploadType === 'photo' ? file.type.startsWith('image/') && file.type !== 'image/gif' : activeUploadType === 'video' ? file.type.startsWith('video/') : file.type === 'image/gif';
      if (!matchesSelection) { showUploadMessage(`Please choose a ${activeUploadType === 'gif' ? 'GIF' : activeUploadType} file for the selected option.`); return; }
      const isPhoto = activeUploadType === 'photo' || activeUploadType === 'gif';
      if (file.size > maxUploadSize) { showUploadMessage('Files must be 90 MB or smaller. Please choose a smaller file.'); return; }
      selectedFile = file;
      fileName.textContent = file.name;
      fileSize.textContent = `${readableSize(file.size)} · ${isPhoto ? 'photo' : 'video'} · ready to upload`;
      document.getElementById('fileTypeIcon').textContent = isPhoto ? '▧' : '▶';
      filePanel.classList.remove('hidden');
      uploadStatus.classList.add('hidden');
    }

    mediaInput.addEventListener('change', () => showFile(mediaInput.files[0]));
    ['dragenter', 'dragover'].forEach((eventName) => { dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.add('is-dragging'); }); });
    ['dragleave', 'drop'].forEach((eventName) => { dropZone.addEventListener(eventName, (event) => { event.preventDefault(); dropZone.classList.remove('is-dragging'); }); });
    dropZone.addEventListener('drop', (event) => showFile(event.dataTransfer.files[0]));

    document.getElementById('clearFile').addEventListener('click', () => {
      selectedFile = null; mediaInput.value = ''; filePanel.classList.add('hidden'); uploadStatus.classList.add('hidden');
    });

    function updateLikeButton(button, result) {
      button.querySelector('.like-count').textContent = result.count;
      button.querySelector('.like-icon').textContent = result.liked ? '♥' : '♡';
      button.setAttribute('aria-pressed', String(result.liked));
    }

    const localLikeStorageKey = 'fullMastiLocalLikes';
    function readLocalLike(mediaId) {
      try { const savedLikes = JSON.parse(localStorage.getItem(localLikeStorageKey) || '{}'); return savedLikes[mediaId] || { count: 0, liked: false }; } catch (error) { return { count: 0, liked: false }; }
    }
    function saveLocalLike(mediaId, state) {
      try { const savedLikes = JSON.parse(localStorage.getItem(localLikeStorageKey) || '{}'); savedLikes[mediaId] = state; localStorage.setItem(localLikeStorageKey, JSON.stringify(savedLikes)); } catch (error) { console.info('This browser could not save the local like state.'); }
    }
    function toggleLocalLike(mediaId, button) {
      const current = readLocalLike(mediaId); const liked = !current.liked;
      const result = { count: Math.max(0, current.count + (liked ? 1 : -1)), liked };
      saveLocalLike(mediaId, result); updateLikeButton(button, result);
    }

    async function loadLikeState(mediaId, button) {
      try {
        const query = new URLSearchParams({ mediaId, visitorId });
        const response = await fetch(`/api/likes?${query}`);
        if (!response.ok) throw new Error('Likes API is unavailable.');
        updateLikeButton(button, await response.json());
      } catch (error) { updateLikeButton(button, readLocalLike(mediaId)); }
    }

    function attachLikeHandler(button) {
      button.addEventListener('click', async () => {
        const mediaId = button.dataset.mediaId; button.disabled = true;
        try {
          const response = await fetch('/api/likes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mediaId, visitorId }) });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || 'Likes API is unavailable.');
          updateLikeButton(button, result);
        } catch (error) {
          toggleLocalLike(mediaId, button); wallStatus.textContent = 'Like saved in this browser. Connect the likes API to share counts with everyone.';
        } finally { button.disabled = false; }
      });
    }

    function makeLikeButton(mediaId) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = `like-button flex items-center gap-1 text-gray-400 hover:text-white transition`;
      button.dataset.mediaId = mediaId; button.setAttribute('aria-pressed', 'false');
      button.innerHTML = '<span class="like-icon text-xl" aria-hidden="true">♡</span><span class="like-count text-sm font-semibold">0</span>';
      attachLikeHandler(button); loadLikeState(mediaId, button); return button;
    }

    // --- NAYA FEED DESIGN RENDERER ---
    function renderMedia(item) {
      const card = document.createElement('article');
      card.className = 'post-card';
      card.dataset.type = item.type;
      const mediaId = item.key || item.id;

      // User Info Header (Avatar, Name, Time)
      const header = document.createElement('div');
      header.className = 'flex items-center gap-3 px-4 py-3';
      
      const avatar = document.createElement('div');
      avatar.className = 'w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-xs font-bold text-white overflow-hidden cursor-pointer';
      if (item.creatorPic) {
        avatar.innerHTML = `<img src="${item.creatorPic}" class="w-full h-full object-cover">`;
      } else {
        avatar.textContent = (item.creator || 'A')[0].toUpperCase();
      }
      avatar.onclick = () => window.location.href = `/profile/index.html?name=${encodeURIComponent(item.creator)}&pic=${encodeURIComponent(item.creatorPic || '')}`;
      
      const creatorInfo = document.createElement('div');
      creatorInfo.className = 'flex flex-col cursor-pointer';
      creatorInfo.onclick = avatar.onclick;
      creatorInfo.innerHTML = `<span class="text-sm font-bold text-white">${item.creator || 'Anonymous'}</span><span class="text-xs text-gray-500">${new Date(item.uploadedAt || Date.now()).toLocaleDateString()}</span>`;
      
      header.append(avatar, creatorInfo);

      // Media
      let media;
      if (item.type === 'photo' || item.type === 'gif') {
        media = document.createElement('img'); media.src = item.url; media.loading = 'lazy'; media.className = 'post-media';
      } else {
        media = document.createElement('video'); media.src = item.url; media.controls = true; media.className = 'post-media';
      }

      // Actions (Like, Comment, Share)
      const actions = document.createElement('div');
      actions.className = 'flex items-center gap-4 px-4 pt-3 pb-1';
      const likeBtn = makeLikeButton(mediaId);
      actions.appendChild(likeBtn);
      
      const commentBtn = document.createElement('button');
      commentBtn.className = 'text-gray-400 hover:text-white transition';
      commentBtn.innerHTML = `<svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>`;
      actions.appendChild(commentBtn);

      // Caption
      const caption = document.createElement('div');
      caption.className = 'px-4 pt-2 text-sm text-white';
      caption.innerHTML = `<span class="font-bold mr-2">${item.creator || 'Anonymous'}</span>${item.title || ''}`;

      card.append(header, media, actions, caption); 
      return card;
    }

    function renderReels(items) {
      const videos = items.filter((item) => item.type === 'video');
      reelsFeed.replaceChildren();
      if (!videos.length) { reelsStatus.textContent = 'No videos yet. Share a video to start the reels feed.'; return; }
      reelsStatus.textContent = '';
      videos.forEach((item) => {
        const card = document.createElement('article'); card.className = 'reel-card rounded-2xl';
        const video = document.createElement('video');
        video.src = item.url; video.controls = true; video.muted = true; video.loop = true; video.playsInline = true; video.preload = 'metadata';
        video.setAttribute('aria-label', item.title || 'Community video');
        const details = document.createElement('div'); details.className = 'reel-details';
        const title = document.createElement('h3'); title.className = 'text-lg font-bold text-white'; title.textContent = item.title || 'Untitled moment';
        
        const creator = document.createElement('p'); creator.className = 'mt-1 text-sm text-gray-400 cursor-pointer hover:underline pointer-events-auto';
        creator.textContent = `by ${item.creator || 'Anonymous creator'}`;
        creator.onclick = (e) => {
          e.stopPropagation();
          window.location.href = `/profile/index.html?name=${encodeURIComponent(item.creator)}&pic=${encodeURIComponent(item.creatorPic || '')}`;
        };

        details.append(title, creator, makeLikeButton(item.key || item.id)); card.append(video, details); reelsFeed.append(card);
      });
      if ('IntersectionObserver' in window) {
        const observer = new IntersectionObserver((entries) => {
          entries.forEach((entry) => {
            const video = entry.target.querySelector('video');
            if (entry.isIntersecting && entry.intersectionRatio >= 0.65) { video.play().catch(() => {}); }
            else { video.pause(); }
          });
        }, { root: reelsFeed, threshold: [0, 0.65, 1] });
        reelsFeed.querySelectorAll('.reel-card').forEach((card) => observer.observe(card));
      }
    }

    function applyFilter() {
      const filter = document.getElementById('mediaFilter').value;
      const cards = [...mediaGrid.children];
      let visibleCount = 0;
      cards.forEach((card) => {
        const isVisible = filter === 'all' || card.dataset.type === filter;
        card.classList.toggle('hidden', !isVisible);
        if (isVisible) visibleCount += 1;
      });
      countLabel.textContent = `${visibleCount} ${visibleCount === 1 ? 'post' : 'posts'}`;
    }

    document.getElementById('mediaFilter').addEventListener('change', applyFilter);

    async function loadMedia() {
      try {
        const response = await fetch('/api/media');
        if (!response.ok) throw new Error('Could not load media.');
        galleryItems = await response.json();
        
        if (!galleryItems.length) {
           wallStatus.textContent = 'Be the first to share a photo or video.';
           mediaGrid.innerHTML = '<div class="text-center text-gray-500 py-10">No posts yet.</div>';
           return;
        }

        mediaGrid.replaceChildren(...galleryItems.map(renderMedia));
        renderReels(galleryItems);
        applyFilter();

        // --- REAL STORIES POPULATE LOGIC ---
        const storiesContainer = document.getElementById('storiesContainer');
        storiesContainer.innerHTML = ''; // Clear existing
        const uniqueCreators = [...new Map(galleryItems.map(item => [item.creator, item])).values()];
        
        uniqueCreators.forEach(user => {
          if (!user.creator || user.creator === 'Anonymous') return;
          const storyDiv = document.createElement('div');
          storyDiv.className = 'flex flex-col items-center gap-1 cursor-pointer shrink-0';
          storyDiv.innerHTML = `
            <div class="story-ring">
              <div class="story-ring-inner flex items-center justify-center bg-gray-800">
                ${user.creatorPic ? `<img src="${user.creatorPic}" class="w-full h-full object-cover rounded-full">` : `<span class="text-white font-bold text-lg">${user.creator[0]}</span>`}
              </div>
            </div>
            <span class="text-xs text-gray-300 w-16 truncate text-center">${user.creator}</span>
          `;
          storiesContainer.appendChild(storyDiv);
        });

      } catch (error) {
        countLabel.textContent = 'Wall offline';
        wallStatus.textContent = 'The public wall will load when the Node.js backend and storage are connected.';
      }
    }

    function showSignedInUser(user) {
      googleUser = user;
      
      let registeredUsers = JSON.parse(localStorage.getItem('reelsBookUsers') || '{}');
      registeredUsers[user.email] = { name: user.name, picture: user.picture, email: user.email };
      localStorage.setItem('reelsBookUsers', JSON.stringify(registeredUsers));
      localStorage.setItem('currentReelsUser', JSON.stringify(registeredUsers[user.email]));

      const accountButton = document.getElementById('accountButton');
      accountButton.textContent = 'My Account';
      accountButton.setAttribute('aria-label', user?.name ? `Signed in as ${user.name}` : 'Signed in');
      
      authStatus.textContent = 'Google account connected. You can publish.';
      authAccount.textContent = `Signed in as ${user.name}`;
      
      googleSignInButton.classList.add('hidden');
      signOutButton.classList.remove('hidden');
      accountDialogStatus.textContent = 'Google account connected.';
      closeAccountDialog();
    }

    function showSignedOutUser(message = 'Sign in with Google to upload. Browsing and watching videos stay open to everyone.') {
      googleUser = null;
      const accountButton = document.getElementById('accountButton');
      accountButton.textContent = 'Log in';
      accountButton.setAttribute('aria-label', 'Log in or sign up');
      authStatus.textContent = message;
      accountDialogStatus.textContent = message;
      authAccount.textContent = '';
      googleSignInButton.classList.remove('hidden');
      signOutButton.classList.add('hidden');
    }

    async function verifyGoogleCredential(credential) {
      const response = await fetch('/api/auth/google', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ credential })
      });
      const result = await response.json();
      if (!response.ok) throw new Error(result.error || 'Google sign-in could not be verified.');
      googleCredential = credential;
      sessionStorage.setItem(authStorageKey, credential);
      showSignedInUser(result);
    }

    async function initializeGoogleSignIn() {
      try {
        const configResponse = await fetch('/api/auth/config');
        const config = await configResponse.json();
        if (!configResponse.ok || !config.googleClientId) {
          showSignedOutUser('Google sign-in is not configured yet. The site owner needs to add GOOGLE_CLIENT_ID.');
          googleSignInButton.textContent = '';
          return;
        }

        let attempts = 0;
        const waitForLibrary = window.setInterval(() => {
          attempts += 1;
          if (window.google?.accounts?.id) {
            window.clearInterval(waitForLibrary);
            window.google.accounts.id.initialize({
              client_id: config.googleClientId,
              callback: async (response) => {
                try {
                  await verifyGoogleCredential(response.credential);
                } catch (error) {
                  showSignedOutUser(error.message);
                }
              }
            });
            window.google.accounts.id.renderButton(googleSignInButton, {
              type: 'standard', theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill'
            });
            window.google.accounts.id.renderButton(document.getElementById('googleContinueButton'), {
              type: 'standard', theme: 'outline', size: 'large', text: 'continue_with', shape: 'pill', width: 280
            });
            window.google.accounts.id.renderButton(document.getElementById('googleSignupButton'), {
              type: 'standard', theme: 'outline', size: 'large', text: 'signup_with', shape: 'pill', width: 280
            });
            if (googleCredential) {
              verifyGoogleCredential(googleCredential).catch(() => {
                googleCredential = '';
                sessionStorage.removeItem(authStorageKey);
                showSignedOutUser('Your Google sign-in expired. Sign in again to upload.');
              });
            }
          } else if (attempts >= 100) {
            window.clearInterval(waitForLibrary);
            showSignedOutUser('Google sign-in could not load. Check your connection and reload the page.');
          }
        }, 100);
      } catch (error) {
        showSignedOutUser('Could not check Google sign-in settings. Please reload the page.');
      }
    }

    signOutButton.addEventListener('click', () => {
      googleCredential = '';
      sessionStorage.removeItem(authStorageKey);
      window.google?.accounts?.id?.disableAutoSelect();
      showSignedOutUser();
    });

    initializeGoogleSignIn();

    document.getElementById('publishButton').addEventListener('click', (event) => {
      if (!googleCredential || !googleUser) {
        showUploadMessage('Sign in with Google before publishing. You can still browse THE RB and watch videos without an account.');
        return;
      }

      if (!selectedFile) {
        showUploadMessage('Choose a photo or video before publishing.');
        return;
      }
      const button = event.currentTarget;
      const title = document.getElementById('mediaTitle').value.trim() || selectedFile.name.replace(/\.[^/.]+$/, '');
      
      const formData = new FormData();
      formData.append('media', selectedFile);
      formData.append('title', title);
      formData.append('creator', googleUser.name || 'Anonymous');
      formData.append('creatorEmail', googleUser.email || '');
      formData.append('creatorPic', googleUser.picture || '');

      button.disabled = true;
      button.textContent = 'Uploading… 0%';
      showUploadMessage('Uploading to cloud storage. Please keep this tab open.');

      const request = new XMLHttpRequest();
      request.open('POST', '/api/upload');
      request.setRequestHeader('Authorization', `Bearer ${googleCredential}`);
      request.timeout = 30 * 60 * 1000;
      request.upload.addEventListener('progress', (progressEvent) => {
        if (!progressEvent.lengthComputable) return;
        const percent = Math.round((progressEvent.loaded / progressEvent.total) * 100);
        button.textContent = `Uploading… ${percent}%`;
        showUploadMessage(`Uploading your ${selectedFile.type.startsWith('image/') ? 'photo' : 'video'}… ${percent}%`);
      });
      request.addEventListener('load', async () => {
        try {
          const result = JSON.parse(request.responseText);
          if (request.status < 200 || request.status >= 300) throw new Error(result.error || `Upload failed (${request.status}).`);
          showUploadMessage('Published successfully to the public wall.');
          selectedFile = null;
          mediaInput.value = '';
          filePanel.classList.add('hidden');
          document.getElementById('mediaTitle').value = '';
          closeUpload(); // Close modal on success
          await loadMedia();
        } catch (error) {
          showUploadMessage(error.message || 'Upload failed. Please try again.');
        } finally {
          button.disabled = false;
          button.textContent = 'Publish';
        }
      });
      request.addEventListener('error', () => {
        showUploadMessage('Network error. Check that the backend is running and try again.');
        button.disabled = false;
        button.textContent = 'Publish';
      });
      request.addEventListener('timeout', () => {
        showUploadMessage('The upload timed out. Try a smaller file or a faster connection.');
        button.disabled = false;
        button.textContent = 'Publish';
      });
      request.send(formData);
    });

    loadMedia();

    // PWA SERVICE WORKER REGISTER
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(registration => console.log('Service Worker registered!', registration.scope))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }

  </script>
