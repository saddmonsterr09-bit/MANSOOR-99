<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icon.png">
    <title>ReelsBook — Modern Social Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/theme.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    
    <style>
        /* ⭐ TEXT SELECTION FIX */
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            background: #000; color: #fff; font-family: 'Inter', sans-serif; padding-bottom: 75px; 
        }
        input, textarea { -webkit-user-select: text; user-select: text; } /* Inputs mein type karne ki ijazat */

        .font-logo { font-family: 'Pacifico', cursive; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        
        .feed-card { background: #0f0f0f; border: 1px solid #27272a; border-radius: 16px; overflow: hidden; margin: 0 auto; max-width: 400px; width: 100%; }
        .feed-media-wrap { position: relative; aspect-ratio: 9/16; background: #000; overflow: hidden; cursor: pointer; }
        .feed-media-wrap video, .feed-media-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
        .feed-play-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2rem; text-shadow: 0 2px 10px rgba(0,0,0,.7); pointer-events: none; user-select: none; }
        .feed-view-badge { position: absolute; left: 8px; bottom: 8px; background: rgba(0,0,0,.7); font-size: 11px; padding: 2px 8px; border-radius: 6px; pointer-events: none; }
        
        .skeleton-card { background: #0f0f0f; border: 1px solid #27272a; border-radius: 16px; overflow: hidden; margin: 0 auto; max-width: 400px; width: 100%; }
        .skeleton-media { position: relative; aspect-ratio: 9/16; background: linear-gradient(90deg, #1a1a1a 0%, #2a2a2a 50%, #1a1a1a 100%); background-size: 200% 100%; animation: shimmer 1.2s infinite; }
        .skeleton-text { height: 16px; background: #1a1a1a; border-radius: 4px; margin: 8px 16px; }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
        
        .modal-overlay { position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,.85); display: flex; align-items: flex-end; justify-content: center; }
        .modal-content { background: #18181b; width: 100%; max-width: 500px; max-height: 80vh; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; }
        
        .icon-badge { position: absolute; top: -4px; right: -6px; background: #ef4444; color: #fff; font-size: 10px; font-weight: bold; min-width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; border-radius: 8px; padding: 0 4px; }
    </style>
</head>
<body class="antialiased">

    <div id="offlineBanner" class="fixed top-14 inset-x-0 z-50 bg-yellow-500 text-black text-center text-sm font-bold py-2 hidden">
        📡 You're offline — showing cached content
    </div>

    <header class="sticky top-0 z-40 bg-black/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex justify-between items-center">
        <a href="/" class="text-2xl font-logo pr-4 sm:pr-8">ReelsBook</a>
        
        <div class="flex items-center gap-4 sm:gap-5">
            <a href="/profile/index.html?tab=messages" class="relative text-white hover:text-[var(--color-primary)] transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
                </svg>
                <span id="headerMsgBadge" class="icon-badge hidden">0</span>
            </a>
            
            <button id="notifBtn" class="relative text-white hover:text-[var(--color-primary)] transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <span id="headerNotifBadge" class="icon-badge hidden">0</span>
            </button>
            
            <button id="toggleUploadTop" class="text-white hover:text-[var(--color-primary)]">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
            </button>
            
            <button id="accountButton" class="rounded-full border border-gray-700 px-3 py-1.5 text-sm font-semibold hover:border-[var(--color-primary)] hover:text-[var(--color-primary)]">
                Log in
            </button>
        </div>
    </header>

    <div id="accountDialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 px-5 backdrop-blur-sm">
        <section class="relative w-full max-w-md rounded-2xl border border-gray-800 bg-gray-900 p-6">
            <button id="closeAccountDialog" class="absolute right-4 top-4 w-9 h-9 rounded-full border border-gray-700 text-xl text-gray-400">×</button>
            <p class="mb-3 text-xs font-bold uppercase tracking-[.2em] text-[var(--color-primary)]">Your account</p>
            <h2 class="text-2xl font-black">Welcome to the wall</h2>
            <p class="mt-3 text-sm text-gray-400">Sign in with Google to upload, add friends, and send messages.</p>
            
            <div class="mt-7 grid gap-3">
                <div id="googleContinueButton" class="flex justify-center"></div>
                <div id="googleSignupButton" class="flex justify-center"></div>
            </div>
            <p id="accountDialogStatus" class="mt-4 text-center text-sm text-red-400"></p>
        </section>
    </div>

    <main class="relative z-10 mx-auto max-w-xl px-4 pb-20">
        <section class="mb-6 border-b border-gray-800 pb-4 pt-4">
            <div class="flex gap-4 overflow-x-auto hide-scrollbar">
                <div id="addStoryBtn" class="flex flex-col items-center gap-1 cursor-pointer shrink-0">
                    <div class="relative w-[62px] h-[62px] rounded-full border border-gray-700 bg-gray-800 flex items-center justify-center">
                        <svg class="w-6 h-6 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                        </svg>
                    </div>
                    <span class="text-xs text-gray-400">Your Story</span>
                </div>
                <div id="storiesContainer" class="flex gap-4"></div>
            </div>
        </section>

        <section class="mb-10">
            <div class="mb-4 flex justify-between items-center">
                <div>
                    <p class="text-xs font-bold uppercase tracking-[.2em] text-[var(--color-primary)]">RECENT CLIPS</p>
                    <h2 class="text-2xl font-black">FRESH ON REELS BOOK</h2>
                </div>
                <a href="/reels/index.html" class="text-sm text-[var(--color-primary)] font-bold">See all →</a>
            </div>

            <div id="clipsGrid" class="flex flex-col gap-6">
                <div class="skeleton-card"><div class="skeleton-media"></div><div class="skeleton-text w-1/3"></div><div class="skeleton-text w-2/3"></div><div class="h-10"></div></div>
                <div class="skeleton-card"><div class="skeleton-media"></div><div class="skeleton-text w-1/3"></div><div class="skeleton-text w-2/3"></div><div class="h-10"></div></div>
            </div>
            <p id="clipsStatus" class="mt-3 text-center text-sm text-gray-400 hidden"></p>
        </section>
    </main>

    <input id="globalMediaInput" type="file" accept="image/*,video/*" class="hidden">
    <div id="globalFilePanel" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 px-4 backdrop-blur-sm">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl p-6 w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4 text-white">Upload File</h3>
            <div class="flex items-center gap-3 mb-4 bg-black p-3 rounded-xl border border-gray-800">
                <div class="w-10 h-10 rounded-lg bg-[var(--color-primary)]/15 flex items-center justify-center text-[var(--color-primary)] text-xl">✦</div>
                <div class="min-w-0 flex-1">
                    <p id="globalFileName" class="truncate text-sm font-bold text-white"></p>
                    <p id="globalFileSize" class="text-xs text-gray-400"></p>
                </div>
            </div>
            <input id="globalMediaTitle" type="text" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-sm text-white mb-4" placeholder="Give it a title...">
            <div class="flex justify-end gap-2">
                <button id="globalCancelUpload" class="px-4 py-2 text-sm text-gray-400 font-bold">Cancel</button>
                <button id="globalPublishBtn" class="px-5 py-2 bg-[var(--color-primary)] text-white text-sm font-bold rounded-lg">Publish</button>
            </div>
            <p id="globalUploadStatus" class="mt-4 text-center text-xs text-[var(--color-primary)] hidden"></p>
        </div>
    </div>

    <nav class="fixed bottom-0 inset-x-0 z-40 bg-black border-t border-gray-800 flex justify-around items-center py-2" style="padding-bottom:max(.75rem,env(safe-area-inset-bottom))">
        <a href="/" class="text-white flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
            <span class="text-[10px]">Home</span>
        </a>
        <button id="bottomPlus" class="bg-[var(--color-primary)] text-white rounded-lg p-2">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        </button>
        <a href="/reels/index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
            <span class="text-[10px]">Reels</span>
        </a>
        <a href="/profile/index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
            <span class="text-[10px]">Profile</span>
        </a>
    </nav>

    <div id="notifModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center px-4 py-3 border-b border-gray-800">
                <h3 class="text-lg font-bold">Notifications</h3>
                <button onclick="closeNotif()" class="text-2xl text-gray-400 px-2">×</button>
            </div>
            <div id="notifList" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
        </div>
    </div>
    
    <div id="commentModal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="flex justify-between items-center px-4 py-3 border-b border-gray-800">
                <h3 class="text-lg font-bold">Comments</h3>
                <button onclick="closeComments()" class="text-2xl text-gray-400 px-2">×</button>
            </div>
            <div id="modalCommentsList" class="flex-1 overflow-y-auto p-4 space-y-3 text-sm"></div>
            <form id="commentForm" class="border-t border-gray-800 p-3 flex gap-2">
                <input id="commentInput" class="flex-1 rounded-lg bg-gray-800 border border-gray-700 px-3 py-2 text-sm" placeholder="Add a comment..." autocomplete="off">
                <button type="submit" class="bg-[var(--color-primary)] text-white px-4 py-2 rounded-lg font-bold text-sm">Post</button>
            </form>
        </div>
    </div>
    
    <div id="reportModal" class="fixed inset-0 z-[100] hidden items-center justify-center bg-black/80 px-4">
        <div class="bg-gray-900 border border-gray-700 rounded-2xl p-6 w-full max-w-sm">
            <h3 class="text-xl font-bold mb-4 text-white">Report Copyright Violation</h3>
            <form id="reportForm">
                <input type="hidden" id="reportMediaId">
                <input type="hidden" id="reportMediaUrl">
                <div class="mb-4">
                    <label class="block text-sm text-gray-400 mb-2">Reason</label>
                    <select id="reportReason" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white">
                        <option value="">Select a reason...</option>
                        <option value="Copyright Infringement">Copyright Infringement</option>
                        <option value="Unauthorized Use">Unauthorized Use of Content</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="flex gap-2 justify-end">
                    <button type="button" onclick="document.getElementById('reportModal').classList.add('hidden')" class="px-4 py-2 text-sm text-gray-400">Cancel</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-red-600 text-white rounded-lg font-bold">Submit</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ⭐ COPY/SEARCH POPUP FIX
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());

        const authStorageKey = 'fullMastiGoogleCredential';
        let googleCredential = '';
        try { googleCredential = localStorage.getItem(authStorageKey) || ''; } catch(e) {}

        let googleUser = null;
        try {
            const stored = localStorage.getItem('currentReelsUser');
            if (stored && stored !== 'undefined') googleUser = JSON.parse(stored);
        } catch(e) { localStorage.removeItem('currentReelsUser'); }

        const visitorId = (() => { 
            let v = localStorage.getItem('ReelsbookVisitorId'); 
            if (!v) { v = crypto.randomUUID(); localStorage.setItem('ReelsbookVisitorId', v); } 
            return v; 
        })();

        const $ = (id) => document.getElementById(id);
        let currentCommentMediaId = null; 

        function bindClick(id, fn) {
            const el = $(id);
            if (el) el.onclick = fn;
        }

        async function loadNotifications() { 
            if (!googleUser) return;
            try {
                const [convRes, pendRes] = await Promise.all([
                    fetch(`/api/conversations?me=${encodeURIComponent(googleUser.email)}`),
                    fetch(`/api/friends/pending?me=${encodeURIComponent(googleUser.email)}`)
                ]);
                let totalMsgs = 0, totalReqs = 0, convList = [], pendList = [];
                if (convRes.ok) { convList = await convRes.json(); totalMsgs = convList.reduce((s, c) => s + (c.unread || 0), 0); }
                if (pendRes.ok) { const p = await pendRes.json(); pendList = p.incoming || []; totalReqs = pendList.length; }
                
                const msgBadge = $('headerMsgBadge'), notifBadge = $('headerNotifBadge');
                const totalNotifs = totalMsgs + totalReqs;
                
                if (msgBadge) {
                    if (totalMsgs > 0) { msgBadge.textContent = totalMsgs > 9 ? '9+' : totalMsgs; msgBadge.classList.remove('hidden'); } else msgBadge.classList.add('hidden');
                }
                if (notifBadge) {
                    if (totalNotifs > 0) { notifBadge.textContent = totalNotifs > 9 ? '9+' : totalNotifs; notifBadge.classList.remove('hidden'); } else notifBadge.classList.add('hidden');
                }
                
                const list = $('notifList'); 
                if (!list) return;
                list.innerHTML = '';
                if (convList.length === 0 && pendList.length === 0) { list.innerHTML = '<p class="text-gray-500 text-center py-4">No new notifications.</p>'; return; }
                
                pendList.forEach(r => { 
                    list.innerHTML += `<div class="flex items-center gap-3 border-b border-gray-800 pb-2 cursor-pointer" onclick="window.location.href='/profile/index.html?name=${encodeURIComponent(r.name||r.email)}&email=${encodeURIComponent(r.email)}'"><img src="${r.picture || 'https://ui-avatars.com/api/?name='+encodeURIComponent(r.name||r.email)}" class="w-8 h-8 rounded-full"><div><p class="font-bold text-[var(--color-primary)]">${r.name || r.email}</p><p class="text-gray-400 text-xs">Started following you.</p></div></div>`; 
                });
                
                convList.forEach(c => { 
                    if (c.unread > 0) { 
                        list.innerHTML += `<div class="flex items-center gap-3 border-b border-gray-800 pb-2 cursor-pointer" onclick="window.location.href='/profile/index.html?tab=messages'"><img src="${c.picture || 'https://ui-avatars.com/api/?name='+encodeURIComponent(c.name||c.email)}" class="w-8 h-8 rounded-full"><div><p class="font-bold text-[var(--color-primary)]">${c.name || c.email}</p><p class="text-gray-400 text-xs">${c.unread} new message${c.unread>1?'s':''}.</p></div></div>`; 
                    } 
                });
            } catch (err) {}
        }
        
        function openNotif() { if (!googleUser) { alert('Please sign in first.'); return; } $('notifModal').classList.remove('hidden'); loadNotifications(); }
        function closeNotif() { $('notifModal').classList.add('hidden'); }
        bindClick('notifBtn', openNotif);

        function updateLikeBtnHtml(btn, count, liked) { btn.innerHTML = `<span style="color:${liked ? '#ec4899' : '#a1a1aa'};font-size:1.2rem;line-height:1">${liked ? '♥' : '♡'}</span> <span>${count}</span>`; btn.setAttribute('aria-pressed', String(liked)); }
        async function fetchLikeState(mediaId, btn) { try { const r = await fetch(`/api/likes?mediaId=${encodeURIComponent(mediaId)}&visitorId=${visitorId}`); if (r.ok) { const d = await r.json(); updateLikeBtnHtml(btn, d.count, d.liked); } } catch {} }
        function toggleLike(mediaId, btn) { btn.disabled = true; fetch('/api/likes', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ mediaId, visitorId }) }).then(r => r.json()).then(d => { if (d.count !== undefined) updateLikeBtnHtml(btn, d.count, d.liked); }).catch(()=>{}).finally(() => { btn.disabled = false; }); }

        async function openComments(mediaId) { currentCommentMediaId = mediaId; $('commentModal').classList.remove('hidden'); loadComments(); }
        function closeComments() { $('commentModal').classList.add('hidden'); currentCommentMediaId = null; }
        async function loadComments() {
            if (!currentCommentMediaId) return; 
            const list = $('modalCommentsList'); list.innerHTML = '<p class="text-gray-500 text-center py-4">Loading...</p>';
            try { 
                const r = await fetch(`/api/comments?mediaId=${encodeURIComponent(currentCommentMediaId)}`); 
                const comments = await r.json(); list.innerHTML = ''; 
                if (!comments.length) { list.innerHTML = '<p class="text-gray-500 text-center py-4">No comments yet. Be the first!</p>'; return; }
                comments.forEach(c => { const div = document.createElement('div'); div.className = 'flex gap-2'; div.innerHTML = `<p class="font-bold text-[var(--color-primary)]">${c.author_name}</p><p class="text-white">${c.body}</p>`; list.appendChild(div); }); 
                list.scrollTop = list.scrollHeight;
            } catch { list.innerHTML = '<p class="text-red-400 text-center py-4">Failed to load comments.</p>'; }
        }
        const cf = $('commentForm');
        if (cf) cf.onsubmit = async (e) => {
            e.preventDefault(); if (!currentCommentMediaId) return; 
            const input = $('commentInput'); const body = input.value.trim(); if (!body) return;
            if (!googleUser) { alert('Please sign in to comment.'); return; } 
            input.value = '';
            try { await fetch('/api/comments', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mediaId: currentCommentMediaId, authorName: googleUser.name, authorEmail: googleUser.email, body }) }); loadComments(); } catch (err) {}
        };

        function openReportModal(mediaId, mediaUrl) { 
            const rId = document.getElementById('reportMediaId'); const rUrl = document.getElementById('reportMediaUrl'); const rModal = document.getElementById('reportModal');
            if (rId) rId.value = mediaId; if (rUrl) rUrl.value = mediaUrl; if (rModal) rModal.classList.remove('hidden'); 
        }
        const rf = document.getElementById('reportForm');
        if (rf) rf.onsubmit = async (e) => {
            e.preventDefault();
            const data = { mediaId: document.getElementById('reportMediaId').value, mediaUrl: document.getElementById('reportMediaUrl').value, reporterEmail: googleUser ? googleUser.email : '', reporterName: googleUser ? googleUser.name : 'Anonymous', reason: document.getElementById('reportReason').value };
            try { const res = await fetch('/api/report', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(data) }); if (res.ok) { alert('Report submitted successfully.'); document.getElementById('reportModal').classList.add('hidden'); } } catch { alert('Network error.'); }
        };

        function renderClips(items) {
            const grid = $('clipsGrid'); const status = $('clipsStatus'); 
            if (!grid) return; grid.innerHTML = '';
            if (!Array.isArray(items)) items = [];
            const videos = items.filter(i => i.type === 'video').slice(0, 3); 
            
            if (!videos.length) { if (status) { status.textContent = 'No clips yet — be the first!'; status.classList.remove('hidden'); } return; }
            if (status) status.classList.add('hidden');

            videos.forEach(v => {
                const card = document.createElement('div'); card.className = 'feed-card';
                const mediaWrap = document.createElement('div'); mediaWrap.className = 'feed-media-wrap'; 
                mediaWrap.onclick = (e) => { e.preventDefault(); window.location.href = `/reels/index.html?focus=${encodeURIComponent(v.key)}`; };
                
                const vid = document.createElement('video'); vid.src = v.url + '#t=0.1'; vid.muted = true; vid.playsInline = true; vid.preload = 'metadata'; 
                vid.onerror = () => { vid.style.display = 'none'; mediaWrap.style.background = '#121212'; };
                
                const play = document.createElement('div'); play.className = 'feed-play-overlay'; play.textContent = '▶';
                const views = document.createElement('div'); views.className = 'feed-view-badge'; views.textContent = `👁 ${v.views || 0}`;
                mediaWrap.append(vid, play, views);

                const details = document.createElement('div'); details.className = 'p-3';
                const title = document.createElement('p'); title.className = 'text-sm text-white font-semibold mb-1'; title.textContent = v.title || 'Untitled';
                
                const creator = document.createElement('p'); creator.className = 'text-xs text-gray-400 mb-3 cursor-pointer hover:underline'; creator.textContent = `by ${v.creator || 'Anonymous'}`;
                creator.onclick = () => { const params = new URLSearchParams(); params.set('name', v.creator || ''); if (v.creatorPic) params.set('pic', v.creatorPic); if (v.creatorEmail) params.set('email', v.creatorEmail); window.location.href = `/profile/index.html?${params.toString()}`; };

                const actions = document.createElement('div'); actions.className = 'flex items-center gap-4 text-sm';
                const likeBtn = document.createElement('button'); likeBtn.className = 'flex items-center gap-1 text-gray-300 hover:text-[var(--color-primary)] transition'; 
                updateLikeBtnHtml(likeBtn, v.likes || 0, false); fetchLikeState(v.key, likeBtn); likeBtn.onclick = () => toggleLike(v.key, likeBtn);
                
                const commentBtn = document.createElement('button'); commentBtn.className = 'flex items-center gap-1 text-gray-300 hover:text-white transition'; 
                commentBtn.innerHTML = `<span style="font-size:1.2rem;line-height:1">💬</span> <span>${v.comments || 0}</span>`; commentBtn.onclick = () => openComments(v.key);
                
                const reportBtn = document.createElement('button'); reportBtn.className = 'flex items-center gap-1 text-gray-400 hover:text-red-500 transition ml-auto text-xs font-bold'; 
                reportBtn.innerHTML = '⚠️ Report'; reportBtn.onclick = () => openReportModal(v.key, v.url);
                
                actions.append(likeBtn, commentBtn, reportBtn); details.append(title, creator, actions); card.append(mediaWrap, details); grid.appendChild(card);
            });
        }

        function renderStories(items) {
            const stories = $('storiesContainer'); if (!stories) return; stories.innerHTML = '';
            if (!Array.isArray(items) || !items.length) return;
            const creators = [...new Map(items.map(i => [i.creator, i])).values()];
            creators.forEach(u => {
                if (!u.creator || u.creator === 'Anonymous') return;
                const d = document.createElement('div'); d.className = 'flex flex-col items-center gap-1 cursor-pointer shrink-0';
                d.innerHTML = `<div class="w-[62px] h-[62px] rounded-full p-[2.5px]" style="background:linear-gradient(45deg,#f09433,#dc2743,#bc1888)"><div class="w-full h-full rounded-full bg-black flex items-center justify-center overflow-hidden border-2 border-black">${u.creatorPic ? `<img src="${u.creatorPic}" class="w-full h-full object-cover rounded-full">` : `<span class="font-bold text-lg">${u.creator[0]}</span>`}</div></div><span class="text-xs text-gray-300 w-16 truncate text-center">${u.creator}</span>`;
                d.onclick = () => { const params = new URLSearchParams(); params.set('name', u.creator || ''); if (u.creatorPic) params.set('pic', u.creatorPic); if (u.creatorEmail) params.set('email', u.creatorEmail); window.location.href = `/profile/index.html?${params.toString()}`; };
                stories.appendChild(d);
            });
        }

        async function loadClips() {
            try { 
                const url = '/api/media' + (googleUser ? `?me=${encodeURIComponent(googleUser.email)}` : '');
                const r = await fetch(url); if (!r.ok) throw new Error('load failed'); 
                const galleryItems = await r.json(); 
                let items = Array.isArray(galleryItems) ? galleryItems : (galleryItems.data || []);
                renderClips(items); renderStories(items); 
            } catch { const status = $('clipsStatus'); if (status) { status.textContent = 'Could not load clips. Check Worker logs.'; status.classList.remove('hidden'); } renderClips([]); }
        }

        bindClick('bottomPlus', () => { if (!googleUser) { openAccountDialog(); return; } $('globalMediaInput').click(); });
        bindClick('addStoryBtn', () => { if (!googleUser) { openAccountDialog(); return; } $('globalMediaInput').click(); });
        bindClick('toggleUploadTop', () => { if (!googleUser) { openAccountDialog(); return; } $('globalMediaInput').click(); });

        const gmi = $('globalMediaInput');
        if (gmi) gmi.onchange = (e) => {
            const file = e.target.files[0]; if (!file) return;
            if (file.size > 90 * 1024 * 1024) return alert('File must be ≤ 90 MB.');
            $('globalFileName').textContent = file.name;
            $('globalFileSize').textContent = `${(file.size / (1024 * 1024)).toFixed(1)} MB · ${file.type.startsWith('video/') ? 'Video' : 'Photo'}`;
            $('globalMediaTitle').value = ''; $('globalUploadStatus').classList.add('hidden');
            $('globalFilePanel').classList.remove('hidden'); $('globalFilePanel').classList.add('flex');
        };

        bindClick('globalCancelUpload', () => { $('globalMediaInput').value = ''; $('globalFilePanel').classList.add('hidden'); $('globalFilePanel').classList.remove('flex'); });

        bindClick('globalPublishBtn', () => {
            const file = $('globalMediaInput').files[0]; if (!file) return;
            const btn = $('globalPublishBtn'); const title = $('globalMediaTitle').value.trim() || file.name.replace(/\.[^/.]+$/, '');
            const fd = new FormData(); fd.append('media', file); fd.append('title', title); fd.append('creator', googleUser.name || 'Anonymous'); fd.append('creatorEmail', googleUser.email || ''); fd.append('creatorPic', googleUser.picture || '');
            btn.disabled = true; btn.textContent = 'Uploading… 0%'; $('globalUploadStatus').textContent = 'Uploading…'; $('globalUploadStatus').classList.remove('hidden');
            
            const req = new XMLHttpRequest(); req.open('POST', '/api/upload'); req.setRequestHeader('Authorization', `Bearer ${googleCredential}`);
            req.upload.addEventListener('progress', e => { if (!e.lengthComputable) return; const p = Math.round((e.loaded/e.total)*100); btn.textContent = `Uploading… ${p}%`; $('globalUploadStatus').textContent = `Uploading… ${p}%`; });
            req.addEventListener('load', async () => {
                try { const result = JSON.parse(req.responseText); if (req.status < 200 || req.status >= 300) throw new Error(result.error || 'Upload failed'); $('globalUploadStatus').textContent = 'Published successfully!'; setTimeout(() => { $('globalFilePanel').classList.add('hidden'); $('globalFilePanel').classList.remove('flex'); $('globalMediaInput').value = ''; loadClips(); }, 1000); } catch (e) { $('globalUploadStatus').textContent = e.message; btn.disabled = false; btn.textContent = 'Publish'; }
            });
            req.addEventListener('error', () => { $('globalUploadStatus').textContent = 'Network error.'; btn.disabled = false; btn.textContent = 'Publish'; });
            req.send(fd);
        });

        // ⭐ LOGIN SUCCESS FIX
        function showSignedInUser(user) {
            googleUser = user; 
            const users = JSON.parse(localStorage.getItem('reelsBookUsers') || '{}'); users[user.email] = user; 
            localStorage.setItem('reelsBookUsers', JSON.stringify(users)); localStorage.setItem('currentReelsUser', JSON.stringify(user));
            
            const accBtn = $('accountButton');
            if (accBtn) accBtn.textContent = 'My Account';
            
            const g1 = $('googleContinueButton'); const g2 = $('googleSignupButton');
            if (g1) g1.classList.add('hidden');
            if (g2) g2.classList.add('hidden');

            const statusEl = $('accountDialogStatus');
            if (statusEl) {
                statusEl.textContent = `Signed in as ${user.name || user.email}`;
                statusEl.classList.add('text-green-500'); statusEl.classList.remove('text-red-400');
            }
            closeAccountDialog(); loadNotifications();
        }
        
        function showSignedOutUser(msg) { 
            googleUser = null; 
            const accBtn = $('accountButton'); if (accBtn) accBtn.textContent = 'Log in';
            
            const g1 = $('googleContinueButton'); const g2 = $('googleSignupButton');
            if (g1) g1.classList.remove('hidden'); if (g2) g2.classList.remove('hidden');

            const statusEl = $('accountDialogStatus');
            if (statusEl) { statusEl.textContent = msg || ''; statusEl.classList.add('text-red-400'); statusEl.classList.remove('text-green-500'); }
        }

        async function verifyGoogleCredential(credential) { 
            const r = await fetch('/api/auth/google', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ credential }) }); 
            const data = await r.json(); 
            if (!r.ok) throw new Error(data.error || 'Sign-in failed'); 
            googleCredential = credential; localStorage.setItem(authStorageKey, credential); showSignedInUser(data); 
        }

        async function initializeGoogleSignIn() {
            try {
                const r = await fetch('/api/auth/config'); const cfg = await r.json(); 
                if (!cfg.googleClientId) { showSignedOutUser('Google sign-in not configured.'); return; }
                
                let attempts = 0; 
                const wait = setInterval(() => { 
                    attempts++; 
                    if (window.google?.accounts?.id) { 
                        clearInterval(wait);
                        google.accounts.id.initialize({ client_id: cfg.googleClientId, callback: async (res) => { try { await verifyGoogleCredential(res.credential); } catch (e) { showSignedOutUser(e.message); } }});
                        
                        const g1 = $('googleSignInButton'), g2 = $('googleContinueButton'), g3 = $('googleSignupButton');
                        if (g1) google.accounts.id.renderButton(g1, { type:'standard', theme:'outline', size:'large', text:'continue_with', shape:'pill' });
                        if (g2) google.accounts.id.renderButton(g2, { type:'standard', theme:'outline', size:'large', text:'continue_with', shape:'pill', width:280 });
                        if (g3) google.accounts.id.renderButton(g3, { type:'standard', theme:'outline', size:'large', text:'signup_with', shape:'pill', width:280 });
                        
                        if (googleCredential) verifyGoogleCredential(googleCredential).catch(() => { googleCredential=''; localStorage.removeItem(authStorageKey); showSignedOutUser('Sign-in expired.'); });
                    } else if (attempts >= 100) { clearInterval(wait); showSignedOutUser('Could not load Google sign-in script.'); } 
                }, 100);
            } catch { showSignedOutUser('Could not reach backend for login config.'); }
        }

        bindClick('signOutButton', () => { googleCredential=''; localStorage.removeItem(authStorageKey); window.google?.accounts?.id?.disableAutoSelect(); showSignedOutUser(); });

        function openAccountDialog() { $('accountDialog').classList.remove('hidden'); $('accountDialog').classList.add('flex'); }
        function closeAccountDialog() { $('accountDialog').classList.add('hidden'); $('accountDialog').classList.remove('flex'); }
        bindClick('accountButton', openAccountDialog); bindClick('closeAccountDialog', closeAccountDialog);
        
        const ad = $('accountDialog');
        if (ad) ad.addEventListener('click', e => { if (e.target === $('accountDialog')) closeAccountDialog(); });

        initializeGoogleSignIn();
        loadClips();
        if (googleUser) loadNotifications();
    </script>
</body>
</html>
