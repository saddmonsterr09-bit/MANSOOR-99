<!doctype html>
<html lang="en">
<head>
  <meta name="google-site-verification" content="DYeiTw87ZycZvB0GuDitM6o21FIz2b1f_7hce86Smls" />
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>ReelsBook — Modern Social Platform</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #000000;
      --surface: #121212;
      --surface-hover: #1e1e1e;
      --text: #ffffff;
      --text-muted: #a1a1aa;
      --border: #27272a;
      --primary: #ef4444;
      --primary-contrast: #ffffff;
      --radius: 12px;
      --color-bg-rgb: 0, 0, 0;
      --color-bg: var(--bg);
      --color-surface: var(--surface);
      --color-text: var(--text);
      --color-muted: var(--text-muted);
      --color-primary: var(--primary);
      --color-primary-contrast: var(--primary-contrast);
    }
    body { background-color: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 70px; }
    .font-logo { font-family: 'Pacifico', cursive; letter-spacing: 0.5px; }
    .hide-scrollbar::-webkit-scrollbar { display: none; }
    .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    .story-ring { background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); padding: 3px; border-radius: 50%; display: inline-block; }
    .story-ring-inner { border: 3px solid var(--bg); border-radius: 50%; padding: 2px; background: var(--bg); overflow: hidden; width: 64px; height: 64px; }
    .post-card { background: var(--bg); border-bottom: 1px solid var(--border); padding-bottom: 1rem; }
    .post-media { width: 100%; max-height: 600px; object-fit: cover; background: #000; }
    #upload { display: none; position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); align-items: center; justify-content: center; }
    #upload.is-open { display: flex; }
    .reels-feed { display: grid; gap: 1rem; max-height: min(78svh, 52rem); overflow-y: auto; scroll-snap-type: y mandatory; }
    .reel-card { position: relative; min-height: 32rem; height: min(78svh, 52rem); overflow: hidden; scroll-snap-align: start; background: var(--surface); border-radius: var(--radius); }
    .reel-card video { width: 100%; height: 100%; object-fit: cover; }
    .reel-details { position: absolute; right: 0; bottom: 0; left: 0; padding: 5rem 1.25rem 1.25rem; background: linear-gradient(transparent, rgba(0,0,0,0.9)); }
    .token-border { border-color: var(--border); }
    .token-panel { background: var(--surface); }
    .upload-zone.is-dragging { border-color: var(--primary); background: rgba(239, 68, 68, 0.1); }
    .like-button[aria-pressed="true"] { color: var(--primary); }
    .like-button[aria-pressed="true"] .like-icon { color: var(--primary); }
  </style>
</head>
<body class="antialiased">

  <header class="sticky top-0 z-40 bg-black/90 backdrop-blur-md border-b token-border px-4 py-3 flex items-center justify-between">
    <a href="/" class="text-2xl font-logo text-white">ReelsBook</a>
    <div class="flex items-center gap-5">
      <button id="toggleUploadTop" class="text-white hover:text-[var(--primary)] transition">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
      </button>
      <button id="accountButton" type="button" class="rounded-full border token-border px-3 py-1.5 text-sm font-semibold transition hover:border-[var(--primary)] hover:text-[var(--primary)]">Log in</button>
    </div>
  </header>

  <main class="max-w-xl mx-auto pt-2">
    <section class="mb-4 border-b token-border pb-4 px-4">
      <div class="flex gap-4 overflow-x-auto hide-scrollbar">
        <div class="flex flex-col items-center gap-1 cursor-pointer shrink-0" id="addStoryBtn">
          <div class="relative w-16 h-16 rounded-full border border-gray-700 bg-[var(--surface)] flex items-center justify-center">
            <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            <div class="absolute bottom-0 right-0 bg-blue-500 rounded-full p-0.5 border-2 border-black">
              <svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
            </div>
          </div>
          <span class="text-xs text-gray-400">Your Story</span>
        </div>
        <div id="storiesContainer" class="flex gap-4"></div>
      </div>
    </section>

    <section id="wall" class="space-y-0">
      <div id="mediaGrid" class="space-y-4">
        <div id="loadingFeed" class="text-center py-10 text-gray-500">Loading posts...</div>
      </div>
      <p id="wallStatus" class="text-center text-sm text-gray-500 py-4" role="status" aria-live="polite"></p>
    </section>

    <section id="reels" class="pt-4 pb-10 px-4 hidden">
      <h2 class="text-xl font-bold mb-4">Reels</h2>
      <div id="reelsFeed" class="reels-feed"></div>
      <p id="reelsStatus" class="mt-4 text-center text-sm text-gray-500" role="status" aria-live="polite"></p>
    </section>
  </main>

  <nav class="fixed bottom-0 inset-x-0 z-40 bg-black border-t token-border flex justify-around items-center py-2 pb-safe">
    <a href="#wall" class="text-white flex flex-col items-center gap-1" id="navHome">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
      <span class="text-[10px]">Home</span>
    </a>
    <button class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <span class="text-[10px]">Search</span>
    </button>
    <button id="bottomPlus" class="bg-[var(--primary)] text-white rounded-lg p-2 hover:brightness-110 transition" aria-expanded="false">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>
    <a href="#reels" class="text-gray-400 hover:text-white flex flex-col items-center gap-1" id="navReels">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span class="text-[10px]">Reels</span>
    </a>
    <a href="/profile/index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
      <span class="text-[10px]">Profile</span>
    </a>
  </nav>

  <div id="upload" class="hidden">
    <div class="bg-[var(--surface)] w-full max-w-md p-6 rounded-xl border token-border relative max-h-[90vh] overflow-y-auto">
      <button id="closeUpload" class="absolute top-4 right-4 text-gray-400 hover:text-white text-xl">✕</button>
      <h2 class="text-xl font-bold mb-4 text-white">Create New Post</h2>
      <div class="mb-4">
        <p id="authStatus" class="text-sm text-gray-400">Sign in to upload.</p>
        <div class="flex items-center gap-3 mt-3">
          <div id="googleSignInButton"></div>
          <button id="signOutButton" type="button" class="hidden rounded-full border token-border px-4 py-2 text-xs font-semibold text-white">Sign out</button>
        </div>
      </div>
      <div class="mb-4 grid grid-cols-3 gap-2">
        <button type="button" class="upload-type-option rounded-lg border token-border bg-[var(--primary)] px-2 py-2 text-sm font-bold text-white transition" data-upload-type="photo" aria-pressed="true">📷 Photo</button>
        <button type="button" class="upload-type-option rounded-lg border token-border bg-[var(--surface)] px-2 py-2 text-sm font-bold text-gray-300 transition" data-upload-type="video" aria-pressed="false">▶ Video</button>
        <button type="button" class="upload-type-option rounded-lg border token-border bg-[var(--surface)] px-2 py-2 text-sm font-bold text-gray-300 transition" data-upload-type="gif" aria-pressed="false">✨ GIF</button>
      </div>
      <label id="dropZone" class="upload-zone flex flex-col items-center justify-center border-2 border-dashed token-border rounded-lg p-8 cursor-pointer">
        <input id="mediaInput" type="file" accept="image/*" class="hidden">
        <span class="text-[var(--primary)] text-3xl mb-2">↑</span>
        <span id="dropTitle" class="text-white font-bold mb-1 text-center">Drag & drop a photo here</span>
      </label>
      <div id="filePanel" class="mt-4 hidden bg-black rounded-lg p-4 border token-border">
        <div class="flex justify-between items-center mb-3">
          <p id="fileName" class="truncate font-bold text-white text-sm"></p>
          <button id="clearFile" class="text-xs text-gray-400 underline ml-2">Remove</button>
        </div>
        <input id="mediaTitle" type="text" placeholder="Write a caption..." class="w-full bg-[var(--surface)] border border-gray-700 rounded p-2 text-white mb-2 text-sm">
        <button id="publishButton" class="w-full bg-[var(--primary)] text-white font-bold py-2 rounded">Publish</button>
        <p id="uploadStatus" class="mt-2 text-sm text-green-500 text-center hidden"></p>
      </div>
    </div>
  </div>

  <div id="accountDialog" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/80 px-5 backdrop-blur-sm">
    <section class="relative w-full max-w-sm bg-[var(--surface)] p-6 rounded-xl border token-border shadow-2xl">
      <button id="closeAccountDialog" class="absolute right-4 top-4 text-gray-400 hover:text-white text-xl">✕</button>
      <h2 class="text-xl font-bold text-white mb-2">Welcome to ReelsBook</h2>
      <div class="grid gap-3">
        <div id="googleContinueButton" class="flex justify-center"></div>
        <div id="googleSignupButton" class="flex justify-center"></div>
      </div>
      <p id="accountDialogStatus" class="mt-4 text-center text-sm text-gray-400"></p>
    </section>
  </div>

  <script>
    // Main logic (Waisa hi hai jo aapne beja tha + profile pic support)
    const mediaInput = document.getElementById('mediaInput');
    const filePanel = document.getElementById('filePanel');
    const fileName = document.getElementById('fileName');
    const uploadStatus = document.getElementById('uploadStatus');
    const wallStatus = document.getElementById('wallStatus');
    const mediaGrid = document.getElementById('mediaGrid');
    const reelsFeed = document.getElementById('reelsFeed');
    const reelsStatus = document.getElementById('reelsStatus');
    const authStatus = document.getElementById('authStatus');
    const googleSignInButton = document.getElementById('googleSignInButton');
    const signOutButton = document.getElementById('signOutButton');
    const accountDialog = document.getElementById('accountDialog');
    const accountDialogStatus = document.getElementById('accountDialogStatus');
    const authStorageKey = 'fullMastiGoogleCredential';
    let googleCredential = sessionStorage.getItem(authStorageKey) || '';
    let googleUser = null;
    const uploadTypes = { photo: { accept: 'image/*' }, video: { accept: 'video/*' }, gif: { accept: 'image/gif' } };
    let activeUploadType = 'photo';
    let selectedFile = null;

    function getVisitorId() { let v = localStorage.getItem('ReelsbookVisitorId'); if (!v) v = crypto.randomUUID(); localStorage.setItem('ReelsbookVisitorId', v); return v; }
    const visitorId = getVisitorId();

    function setUploadType(type) {
      activeUploadType = type;
      mediaInput.accept = uploadTypes[type].accept;
      document.querySelectorAll('.upload-type-option').forEach((btn) => {
        const isActive = btn.dataset.uploadType === type;
        btn.setAttribute('aria-pressed', String(isActive));
        btn.classList.toggle('bg-[var(--primary)]', isActive);
        btn.classList.toggle('text-white', isActive);
        btn.classList.toggle('bg-[var(--surface)]', !isActive);
        btn.classList.toggle('text-gray-300', !isActive);
      });
      selectedFile = null; mediaInput.value = ''; filePanel.classList.add('hidden');
    }

    document.querySelectorAll('.upload-type-option').forEach((btn) => btn.addEventListener('click', () => setUploadType(btn.dataset.uploadType)));
    document.getElementById('addStoryBtn').addEventListener('click', () => document.getElementById('upload').classList.add('is-open', 'flex'));
    
    // Simplification for the prompt
    document.getElementById('closeUpload').addEventListener('click', () => document.getElementById('upload').classList.remove('is-open', 'flex'));
    document.getElementById('toggleUploadTop').addEventListener('click', () => document.getElementById('upload').classList.add('is-open', 'flex'));
    document.getElementById('bottomPlus').addEventListener('click', () => document.getElementById('upload').classList.add('is-open', 'flex'));
    document.getElementById('accountButton').addEventListener('click', () => accountDialog.classList.replace('hidden', 'flex'));
    document.getElementById('closeAccountDialog').addEventListener('click', () => accountDialog.classList.replace('flex', 'hidden'));

    mediaInput.addEventListener('change', () => {
      const file = mediaInput.files[0]; if (!file) return;
      selectedFile = file; fileName.textContent = file.name; filePanel.classList.remove('hidden');
    });
    document.getElementById('clearFile').addEventListener('click', () => { selectedFile = null; mediaInput.value = ''; filePanel.classList.add('hidden'); });

    function updateLikeButton(button, result) {
      button.querySelector('.like-count').textContent = result.count;
      button.querySelector('.like-icon').textContent = result.liked ? '♥' : '♡';
      button.setAttribute('aria-pressed', String(result.liked));
    }
    async function loadLikeState(mediaId, button) {
      try { const res = await fetch(`/api/likes?mediaId=${mediaId}&visitorId=${visitorId}`); if (res.ok) updateLikeButton(button, await res.json()); } catch (e) {}
    }
    function makeLikeButton(mediaId) {
      const btn = document.createElement('button'); btn.className = 'like-button flex items-center gap-1 text-gray-400 hover:text-white transition'; btn.dataset.mediaId = mediaId; btn.setAttribute('aria-pressed', 'false');
      btn.innerHTML = '<span class="like-icon text-xl">♡</span><span class="like-count text-sm font-semibold">0</span>';
      btn.onclick = async () => {
        try { const res = await fetch('/api/likes', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ mediaId, visitorId }) }); if (res.ok) updateLikeButton(btn, await res.json()); } catch (e) {}
      };
      loadLikeState(mediaId, btn); return btn;
    }

    function renderMedia(item) {
      const card = document.createElement('article'); card.className = 'post-card'; card.dataset.type = item.type;
      const mediaId = item.key || item.id;
      const header = document.createElement('div'); header.className = 'flex items-center gap-3 px-4 py-3';
      const avatar = document.createElement('div'); avatar.className = 'w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-xs font-bold text-white overflow-hidden';
      if (item.creatorPic) avatar.innerHTML = `<img src="${item.creatorPic}" class="w-full h-full object-cover">`; else avatar.textContent = (item.creator || 'A')[0].toUpperCase();
      
      const creatorInfo = document.createElement('div'); creatorInfo.className = 'flex flex-col';
      creatorInfo.innerHTML = `<span class="text-sm font-bold text-white">${item.creator || 'Anonymous'}</span><span class="text-xs text-gray-500">${new Date(item.uploadedAt || Date.now()).toLocaleDateString()}</span>`;
      header.append(avatar, creatorInfo);
      
      let media;
      if (item.type === 'photo' || item.type === 'gif') { media = document.createElement('img'); media.src = item.url; media.className = 'post-media'; }
      else { media = document.createElement('video'); media.src = item.url; media.controls = true; media.className = 'post-media'; }

      const actions = document.createElement('div'); actions.className = 'flex items-center gap-4 px-4 pt-3 pb-1';
      actions.appendChild(makeLikeButton(mediaId));
      const caption = document.createElement('div'); caption.className = 'px-4 pt-2 text-sm text-white';
      caption.innerHTML = `<span class="font-bold mr-2">${item.creator || 'Anonymous'}</span>${item.title || ''}`;
      card.append(header, media, actions, caption); return card;
    }

    function renderReels(items) {
      const videos = items.filter(i => i.type === 'video');
      reelsFeed.innerHTML = videos.length ? '' : '<p class="text-gray-500">No videos yet.</p>';
      videos.forEach(item => {
        const card = document.createElement('article'); card.className = 'reel-card';
        const video = document.createElement('video'); video.src = item.url; video.controls = true; video.loop = true;
        const details = document.createElement('div'); details.className = 'reel-details';
        details.innerHTML = `<h3 class="text-lg font-bold text-white">${item.title || 'Untitled'}</h3><p class="text-sm text-gray-400 mb-3">by ${item.creator || 'Anonymous'}</p>`;
        details.appendChild(makeLikeButton(item.key || item.id));
        card.append(video, details); reelsFeed.append(card);
      });
    }

    async function loadMedia() {
      document.getElementById('loadingFeed')?.remove();
      try {
        const res = await fetch('/api/media'); if (!res.ok) throw new Error('Failed');
        const items = await res.json();
        if (!items.length) { mediaGrid.innerHTML = '<div class="text-center text-gray-500 py-10">No posts yet.</div>'; return; }
        mediaGrid.innerHTML = ''; items.forEach(i => mediaGrid.appendChild(renderMedia(i)));
        renderReels(items);
        
        const stories = document.getElementById('storiesContainer'); stories.innerHTML = '';
        const unique = [...new Map(items.map(i => [i.creator, i])).values()];
        unique.forEach(u => {
          if (!u.creator || u.creator === 'Anonymous') return;
          const s = document.createElement('div'); s.className = 'flex flex-col items-center gap-1 shrink-0';
          s.innerHTML = `<div class="story-ring"><div class="story-ring-inner flex items-center justify-center bg-gray-800">${u.creatorPic ? `<img src="${u.creatorPic}" class="w-full h-full object-cover rounded-full">` : `<span class="text-white font-bold text-lg">${u.creator[0]}</span>`}</div></div><span class="text-xs text-gray-300 w-16 truncate text-center">${u.creator}</span>`;
          stories.appendChild(s);
        });
      } catch (e) { wallStatus.textContent = 'Could not load media.'; }
    }

    async function initializeGoogleSignIn() {
      try {
        const config = await (await fetch('/api/auth/config')).json();
        if (!config.googleClientId) return;
        window.google?.accounts.id.initialize({
          client_id: config.googleClientId,
          callback: async (response) => {
            const res = await fetch('/api/auth/google', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ credential: response.credential }) });
            const user = await res.json();
            if (res.ok) {
              googleCredential = response.credential; googleUser = user; sessionStorage.setItem(authStorageKey, googleCredential);
              document.getElementById('accountButton').textContent = 'My Account'; authStatus.textContent = `Signed in as ${user.name}`; googleSignInButton.classList.add('hidden'); signOutButton.classList.remove('hidden'); accountDialog.classList.replace('flex', 'hidden');
            }
          }
        });
        window.google?.accounts.id.renderButton(googleSignInButton, { type: 'standard', theme: 'outline', text: 'continue_with' });
        window.google?.accounts.id.renderButton(document.getElementById('googleContinueButton'), { type: 'standard', theme: 'outline', text: 'continue_with' });
        window.google?.accounts.id.renderButton(document.getElementById('googleSignupButton'), { type: 'standard', theme: 'outline', text: 'signup_with' });
      } catch (e) {}
    }
    setTimeout(initializeGoogleSignIn, 1000);
    signOutButton.addEventListener('click', () => { googleCredential = ''; googleUser = null; sessionStorage.removeItem(authStorageKey); location.reload(); });

    document.getElementById('publishButton').addEventListener('click', async (e) => {
      if (!googleCredential || !googleUser) return alert('Sign in first');
      if (!selectedFile) return alert('Choose a file');
      const btn = e.currentTarget; btn.disabled = true; btn.textContent = 'Uploading...';
      const fd = new FormData(); fd.append('media', selectedFile); fd.append('title', document.getElementById('mediaTitle').value || selectedFile.name); fd.append('creator', googleUser.name); fd.append('creatorEmail', googleUser.email); fd.append('creatorPic', googleUser.picture || '');
      try {
        const res = await fetch('/api/upload', { method: 'POST', headers: { 'Authorization': `Bearer ${googleCredential}` }, body: fd });
        if (!res.ok) throw new Error('Upload failed');
        document.getElementById('upload').classList.remove('is-open', 'flex'); await loadMedia();
      } catch (err) { alert(err.message); } finally { btn.disabled = false; btn.textContent = 'Publish'; }
    });

    document.getElementById('navReels').onclick = (e) => { e.preventDefault(); document.getElementById('wall').classList.add('hidden'); document.getElementById('reels').classList.remove('hidden'); };
    document.getElementById('navHome').onclick = (e) => { e.preventDefault(); document.getElementById('reels').classList.add('hidden'); document.getElementById('wall').classList.remove('hidden'); };
    loadMedia();
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
