<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Search — ReelsBook</title>
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body {
    -webkit-touch-callout: none; -webkit-user-select: none; -khtml-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none;
    background:#000; color:#fff; font-family:'Inter',sans-serif; padding-bottom: 75px;
}
input, textarea { -webkit-user-select: text; user-select: text; }
</style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-30 bg-black/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex justify-between items-center">
  <a href="/" class="text-2xl font-black">←</a>
  <h1 class="text-lg font-bold">Search People</h1>
  <div class="w-8"></div>
</header>

<main class="max-w-xl mx-auto px-4 py-6">
  <div class="mb-6">
    <input id="searchInput" type="text" placeholder="Search by name or email…" class="w-full rounded-xl bg-gray-800 border border-gray-700 px-5 py-3 text-sm outline-none focus:border-[var(--color-primary)] transition">
  </div>

  <div id="resultsList" class="space-y-2"></div>
  
  <div id="statusText" class="text-center text-sm text-gray-400 py-10">
    Type a name to start searching...
  </div>
</main>

<!-- Bottom Navigation -->
<nav class="fixed bottom-0 inset-x-0 z-40 bg-black border-t border-gray-800 flex justify-around items-center py-2" style="padding-bottom:max(.75rem,env(safe-area-inset-bottom))">
    <a href="/" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
        <span class="text-[10px]">Home</span>
    </a>
    <a href="/search/index.html" class="text-white flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
        <span class="text-[10px]">Search</span>
    </a>
    <a href="/#upload" class="bg-[var(--color-primary)] text-white rounded-lg p-2">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
    </a>
    <a href="/reels/index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/><circle cx="12" cy="12" r="9" stroke-width="2"/></svg>
        <span class="text-[10px]">Reels</span>
    </a>
    <a href="/profile/index.html" class="text-gray-400 hover:text-white flex flex-col items-center gap-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        <span class="text-[10px]">Profile</span>
    </a>
</nav>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());

let me = null;
try { const stored = localStorage.getItem('currentReelsUser'); if (stored && stored !== 'undefined') me = JSON.parse(stored); } catch(e) {}

const searchInput = document.getElementById('searchInput');
const resultsList = document.getElementById('resultsList');
const statusText = document.getElementById('statusText');
let searchTimeout;

async function performSearch() {
  const query = searchInput.value.trim();
  
  if (!query) {
    resultsList.innerHTML = '';
    statusText.textContent = 'Type a name to start searching...';
    statusText.classList.remove('hidden');
    return;
  }

  if (!me) {
    statusText.textContent = 'Please sign in from the home page to search users.';
    statusText.classList.remove('hidden');
    return;
  }

  statusText.textContent = 'Searching...';
  statusText.classList.remove('hidden');
  resultsList.innerHTML = '';

  try {
    const r = await fetch(`/api/users/list?me=${encodeURIComponent(me.email)}&q=${encodeURIComponent(query)}`);
    if (!r.ok) throw new Error('failed');
    const users = await r.json();
    
    statusText.classList.add('hidden');

    if (!users.length) {
      statusText.textContent = 'No users found matching your search.';
      statusText.classList.remove('hidden');
      return;
    }

    users.forEach(u => {
      const row = document.createElement('div'); 
      row.className = 'flex items-center gap-3 p-3 bg-gray-900 border border-gray-800 rounded-xl mb-2';
      
      let actionHtml = '';
      if (u.status === 'friends') actionHtml = '<span class="text-xs text-[var(--color-primary)] font-bold px-2">✓ Friends</span>';
      else if (u.status === 'following') actionHtml = '<span class="text-xs text-gray-400 px-2">Following</span>';
      else if (u.status === 'follower') actionHtml = `<button data-followback="${u.email}" class="text-xs bg-[var(--color-primary)] px-3 py-1.5 rounded-full font-bold">Follow Back</button>`;
      else actionHtml = `<button data-follow="${u.email}" class="text-xs bg-[var(--color-primary)] px-4 py-1.5 rounded-full font-bold">+ Follow</button>`;
      
      row.innerHTML = `
        <img src="${u.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.name || u.email)}" class="w-12 h-12 rounded-full border border-gray-700" onclick="window.location.href='/profile/index.html?name=${encodeURIComponent(u.name)}&email=${encodeURIComponent(u.email)}&pic=${encodeURIComponent(u.picture || '')}'">
        <div class="flex-1 min-w-0" onclick="window.location.href='/profile/index.html?name=${encodeURIComponent(u.name)}&email=${encodeURIComponent(u.email)}&pic=${encodeURIComponent(u.picture || '')}'">
          <p class="font-bold text-sm truncate text-white">${u.name || u.email}</p>
          <p class="text-xs text-gray-400 truncate">${u.email}</p>
        </div>
        <div class="flex items-center gap-2">
          ${actionHtml}
          <button data-msg="${u.email}" data-name="${(u.name || '').replace(/"/g,'&quot;')}" data-pic="${u.picture || ''}" class="text-xs bg-gray-800 border border-gray-700 px-3 py-1.5 rounded-full font-bold hover:border-[var(--color-primary)]">💬</button>
        </div>
      `;
      resultsList.appendChild(row);
    });

    // Attach event listeners
    resultsList.querySelectorAll('[data-follow]').forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      b.disabled = true; b.textContent = '...';
      await fetch('/api/follow', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ me: me.email, target: b.dataset.follow }) });
      performSearch();
    });

    resultsList.querySelectorAll('[data-followback]').forEach(b => b.onclick = async (e) => {
      e.stopPropagation();
      b.disabled = true; b.textContent = '...';
      await fetch('/api/follow', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ me: me.email, target: b.dataset.followback }) });
      performSearch();
    });

    resultsList.querySelectorAll('[data-msg]').forEach(b => b.onclick = (e) => {
      e.stopPropagation();
      // Send them to profile to use the message feature there, or you can implement a message modal here
      window.location.href = `/profile/index.html?name=${encodeURIComponent(b.dataset.name)}&email=${encodeURIComponent(b.dataset.msg)}&pic=${encodeURIComponent(b.dataset.pic)}`;
    });

  } catch (err) {
    statusText.textContent = 'Could not perform search. Check internet.';
    statusText.classList.remove('hidden');
  }
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(performSearch, 400); // 400ms debounce
});
</script>
</body>
</html>
