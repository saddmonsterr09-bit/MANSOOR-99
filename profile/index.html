<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>Profile — ReelsBook</title>
<link rel="stylesheet" href="/theme.css">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#000; color:#fff; font-family:'Inter',sans-serif; }
.video-card { position:relative; aspect-ratio:9/16; background:#121212; border-radius:12px; overflow:hidden; cursor:pointer; }
.video-card video { width:100%; height:100%; object-fit:cover; }
.video-card .play-icon { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:2rem; color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.7); pointer-events:none; }
.video-card .badges { position:absolute; left:4px; bottom:4px; display:flex; gap:4px; }
.video-card .badge { background:rgba(0,0,0,.7); font-size:11px; padding:2px 6px; border-radius:6px; }
</style>
</head>
<body class="min-h-screen">

<header class="sticky top-0 z-30 bg-black/90 backdrop-blur border-b border-gray-800 px-4 py-3 flex justify-between items-center">
  <a href="/" class="text-2xl font-black">←</a>
  <h1 class="text-lg font-bold">Profile</h1>
  <div class="w-8"></div>
</header>

<main class="max-w-3xl mx-auto px-4 py-6">

  <section class="flex flex-col sm:flex-row items-center sm:items-start gap-5 mb-8">
    <img id="profilePic" src="" alt="" class="w-24 h-24 rounded-full object-cover border-4 border-[var(--color-primary)] bg-gray-800">
    <div class="flex-1 text-center sm:text-left">
      <h2 id="profileName" class="text-2xl font-black">Loading…</h2>
      <p id="profileEmail" class="text-sm text-gray-400 mt-1"></p>
      <div class="flex justify-center sm:justify-start gap-6 mt-3">
        <div><p id="videoCount" class="text-lg font-bold">0</p><p class="text-xs text-gray-400">Videos</p></div>
        <div><p id="friendCount" class="text-lg font-bold">0</p><p class="text-xs text-gray-400">Friends</p></div>
      </div>
      <div id="profileActions" class="mt-4 flex flex-wrap justify-center sm:justify-start gap-2"></div>
    </div>
  </section>

  <div class="mb-6 border-b border-gray-800 flex gap-6 justify-center">
    <button id="tabVideos" class="pb-3 border-b-2 border-[var(--color-primary)] font-bold text-sm">Videos</button>
    <button id="tabFriends" class="pb-3 border-b-2 border-transparent font-bold text-sm text-gray-400">Friends</button>
    <button id="tabFindPeople" class="pb-3 border-b-2 border-transparent font-bold text-sm text-gray-400 hidden">Find People</button>
  </div>

  <div id="videosTab">
    <div id="userVideosGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3"></div>
    <div id="noVideosState" class="hidden text-center py-12">
      <div class="text-5xl mb-3">🎥</div>
      <h3 class="text-xl font-bold mb-2">No videos yet</h3>
    </div>
    <div id="loadingState" class="text-center py-12 text-gray-400">Loading…</div>
  </div>

  <div id="friendsTab" class="hidden">
    <div id="incomingList" class="mb-6"></div>
    <div id="friendsList"></div>
  </div>

  <div id="findPeopleTab" class="hidden">
    <div class="mb-4">
      <input id="findSearchInput" type="text" placeholder="Search by name or email…" class="w-full rounded-lg bg-gray-800 border border-gray-700 px-4 py-2.5 text-sm outline-none focus:border-[var(--color-primary)]">
    </div>
    <p class="text-xs text-gray-500 mb-4">💡 Only users who have signed in at least once appear here.</p>
    <div id="findResultsList" class="space-y-1"></div>
    <div id="findStatus" class="text-center text-sm text-gray-400 py-4 hidden"></div>
  </div>

</main>

<div id="messageDrawer" class="fixed inset-0 z-50 hidden">
  <div class="absolute inset-0 bg-black/80" onclick="closeMessages()"></div>
  <div class="absolute inset-y-0 right-0 w-full max-w-md bg-gray-900 border-l border-gray-800 flex flex-col">
    <div class="flex justify-between items-center px-4 py-3 border-b border-gray-800">
      <div>
        <p id="msgWithName" class="font-bold">Chat</p>
        <p id="msgWithEmail" class="text-xs text-gray-400"></p>
      </div>
      <button onclick="closeMessages()" class="text-2xl text-gray-400">×</button>
    </div>
    <div id="msgList" class="flex-1 overflow-y-auto p-4 space-y-2 text-sm"></div>
    <form id="msgForm" class="border-t border-gray-800 p-3 flex gap-2">
      <input id="msgInput" class="flex-1 rounded-lg bg-gray-800 border border-gray-700 px-3 py-2 text-sm" placeholder="Type a message…">
      <button class="bg-[var(--color-primary)] px-4 py-2 rounded-lg font-bold text-sm">Send</button>
    </form>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(location.search);
const viewedEmail = (urlParams.get('email') || '').trim().toLowerCase();
const viewedName = (urlParams.get('name') || '').trim();
const viewedPic = urlParams.get('pic') || '';
const me = JSON.parse(localStorage.getItem('currentReelsUser') || 'null');

let targetEmail = '';
let targetName = '';
let targetPic = '';
let isOwnProfile = false;
let currentChatWith = null;

async function resolveTarget() {
  if (viewedEmail) {
    targetEmail = viewedEmail;
    targetName = viewedName || viewedEmail;
    targetPic = viewedPic;
    isOwnProfile = !!(me && me.email && me.email.toLowerCase() === viewedEmail);
    return;
  }
  if (viewedName) {
    if (me && me.name && me.name.toLowerCase() === viewedName.toLowerCase()) {
      isOwnProfile = true;
      targetEmail = (me.email || '').toLowerCase();
      targetName = me.name;
      targetPic = me.picture || viewedPic;
      return;
    }
    isOwnProfile = false;
    targetName = viewedName;
    targetPic = viewedPic;
    try {
      const r = await fetch(`/api/users/find?name=${encodeURIComponent(viewedName)}`);
      if (r.ok) {
        const u = await r.json();
        if (u && u.email) {
          targetEmail = u.email.toLowerCase();
          if (!targetPic && u.picture) targetPic = u.picture;
        }
      }
    } catch {}
    return;
  }
  isOwnProfile = true;
  targetEmail = (me?.email || '').toLowerCase();
  targetName = me?.name || 'User';
  targetPic = me?.picture || '';
}

async function loadProfileStats() {
  try {
    const [mediaR, friendsR] = await Promise.all([
      fetch('/api/media?t=' + Date.now()),
      targetEmail ? fetch(`/api/friends/list?me=${encodeURIComponent(targetEmail)}`) : Promise.resolve({ ok:false })
    ]);
    const allMedia = mediaR.ok ? await mediaR.json() : [];
    const friends = friendsR.ok ? await friendsR.json() : [];
    document.getElementById('friendCount').textContent = friends.length;

    const userVideos = allMedia.filter(m => m.type === 'video' && (
      (targetEmail && m.creatorEmail && m.creatorEmail.toLowerCase() === targetEmail) ||
      (targetName && m.creator && m.creator.toLowerCase() === targetName.toLowerCase())
    ));
    document.getElementById('videoCount').textContent = userVideos.length;
    document.getElementById('loadingState').classList.add('hidden');

    const grid = document.getElementById('userVideosGrid');
    const empty = document.getElementById('noVideosState');
    grid.innerHTML = '';
    if (!userVideos.length) { empty.classList.remove('hidden'); return; }

    userVideos.forEach(v => {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.onclick = () => { location.href = `/reels/index.html?focus=${encodeURIComponent(v.key)}`; };
      const vid = document.createElement('video');
      vid.src = v.url + '#t=0.1';
      vid.muted = true; vid.playsInline = true; vid.preload = 'metadata';
      const play = document.createElement('div'); play.className = 'play-icon'; play.textContent = '▶';
      const badges = document.createElement('div'); badges.className = 'badges';
      badges.innerHTML = `<span class="badge">👁 ${v.views || 0}</span><span class="badge">♥ ${v.likes || 0}</span>`;
      card.append(vid, play, badges);
      grid.appendChild(card);
    });
  } catch { document.getElementById('loadingState').textContent = 'Failed to load.'; }
}

async function loadFriendsList() {
  if (!targetEmail) return;
  const list = document.getElementById('friendsList');
  const incoming = document.getElementById('incomingList');
  list.innerHTML = ''; incoming.innerHTML = '';

  if (isOwnProfile) {
    try {
      const r = await fetch(`/api/friends/pending?me=${encodeURIComponent(targetEmail)}`);
      if (r.ok) {
        const data = await r.json();
        if (data.incoming?.length) {
          incoming.innerHTML = `<h3 class="font-bold mb-2">Pending requests</h3>`;
          data.incoming.forEach(u => {
            const row = document.createElement('div');
            row.className = 'flex items-center gap-3 py-2 border-b border-gray-800';
            row.innerHTML = `
              <img src="${u.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.name || u.email)}" class="w-10 h-10 rounded-full">
              <div class="flex-1"><p class="font-semibold text-sm">${u.name || u.email}</p><p class="text-xs text-gray-400">${u.email}</p></div>
              <button class="text-xs bg-[var(--color-primary)] px-3 py-1 rounded-full font-bold" data-accept="${u.id}">Accept</button>
              <button class="text-xs border border-gray-700 px-3 py-1 rounded-full" data-reject="${u.id}">Reject</button>
            `;
            incoming.appendChild(row);
          });
          incoming.querySelectorAll('[data-accept]').forEach(b => b.onclick = async () => {
            await fetch('/api/friends/accept', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ me: targetEmail, requestId: b.dataset.accept }) });
            loadFriendsList(); loadProfileStats();
          });
          incoming.querySelectorAll('[data-reject]').forEach(b => b.onclick = async () => {
            await fetch('/api/friends/reject', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ me: targetEmail, requestId: b.dataset.reject }) });
            loadFriendsList();
          });
        }
      }
    } catch {}
  }

  try {
    const r = await fetch(`/api/friends/list?me=${encodeURIComponent(targetEmail)}`);
    if (!r.ok) return;
    const friends = await r.json();
    if (!friends.length) {
      if (list.innerHTML === '') list.innerHTML = '<p class="text-center text-gray-400 text-sm py-4">No friends yet.</p>';
      return;
    }
    const header = document.createElement('h3');
    header.className = 'font-bold mb-2';
    header.textContent = 'Friends';
    list.appendChild(header);
    friends.forEach(f => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-3 py-2 border-b border-gray-800 cursor-pointer hover:bg-gray-900 px-2 rounded';
      row.innerHTML = `
        <img src="${f.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(f.name || f.email)}" class="w-10 h-10 rounded-full">
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-sm truncate">${f.name || f.email}</p>
          <p class="text-xs text-gray-400 truncate">${f.lastMessage || ''}</p>
        </div>
      `;
      row.onclick = () => openMessages(f);
      list.appendChild(row);
    });
  } catch {}
}

// ⭐ Find People tab logic
async function loadFindPeople() {
  if (!me || !me.email) return;
  const search = document.getElementById('findSearchInput').value.trim();
  const statusEl = document.getElementById('findStatus');
  const listEl = document.getElementById('findResultsList');
  statusEl.textContent = 'Loading…'; statusEl.classList.remove('hidden');
  listEl.innerHTML = '';
  try {
    const r = await fetch(`/api/users/list?me=${encodeURIComponent(me.email)}&q=${encodeURIComponent(search)}`);
    if (!r.ok) throw new Error('failed');
    const users = await r.json();
    statusEl.classList.add('hidden');
    if (!users.length) {
      statusEl.textContent = 'No users found. Only users who have signed in at least once appear here.';
      statusEl.classList.remove('hidden');
      return;
    }
    users.forEach(u => {
      const row = document.createElement('div');
      row.className = 'flex items-center gap-3 py-2 border-b border-gray-800';
      let actionHtml = '';
      if (u.status === 'friends') actionHtml = '<span class="text-xs text-[var(--color-primary)] font-bold">✓ Friends</span>';
      else if (u.status === 'outgoing') actionHtml = '<span class="text-xs text-gray-400">Request sent</span>';
      else if (u.status === 'incoming') actionHtml = `<button data-accept="${u.requestId}" class="text-xs bg-[var(--color-primary)] px-3 py-1 rounded-full font-bold">Accept</button>`;
      else actionHtml = `<button data-add="${u.email}" class="text-xs border border-gray-700 px-3 py-1 rounded-full hover:border-[var(--color-primary)]">+ Add</button>`;
      row.innerHTML = `
        <img src="${u.picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(u.name || u.email)}" class="w-10 h-10 rounded-full">
        <div class="flex-1 min-w-0">
          <p class="font-semibold text-sm truncate">${u.name || u.email}</p>
          <p class="text-xs text-gray-400 truncate">${u.email}</p>
        </div>
        ${actionHtml}
      `;
      listEl.appendChild(row);
    });
    listEl.querySelectorAll('[data-add]').forEach(b => b.onclick = async () => {
      b.disabled = true; b.textContent = 'Sending…';
      try {
        const r = await fetch('/api/friends/request', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ from: me.email, to: b.dataset.add }) });
        const d = await r.json().catch(() => ({}));
        if (!r.ok) alert('Could not send: ' + (d.error || `HTTP ${r.status}`));
      } catch (e) { alert('Network error: ' + e.message); }
      loadFindPeople();
    });
    listEl.querySelectorAll('[data-accept]').forEach(b => b.onclick = async () => {
      await fetch('/api/friends/accept', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ me: me.email, requestId: b.dataset.accept }) });
      loadFindPeople(); loadFriendsList();
    });
  } catch {
    statusEl.textContent = 'Could not load users.'; statusEl.classList.remove('hidden');
  }
}

async function loadFriendButton() {
  const actions = document.getElementById('profileActions');
  actions.innerHTML = '';

  if (isOwnProfile) return;

  if (!me) {
    actions.innerHTML = '<a href="/" class="text-sm text-[var(--color-primary)] underline">Sign in to add friends →</a>';
    return;
  }
  if (!targetEmail) {
    actions.innerHTML = `
      <div class="text-sm text-gray-400 text-center sm:text-left">
        <p>⚠️ Could not find <strong>${targetName || 'this user'}</strong> in the user database.</p>
        <p class="text-xs mt-1">They may not have signed in yet.</p>
        <button onclick="switchToFindPeople()" class="text-[var(--color-primary)] underline mt-2 text-xs font-bold">Find people manually →</button>
      </div>
    `;
    return;
  }

  try {
    const r = await fetch(`/api/friends/status?me=${encodeURIComponent(me.email)}&target=${encodeURIComponent(targetEmail)}`);
    const data = await r.json();
    actions.innerHTML = '';
    if (data.status === 'friends') {
      const b = document.createElement('button');
      b.className = 'rounded-full bg-[var(--color-primary)] px-5 py-2 text-sm font-bold';
      b.textContent = '💬 Message';
      b.onclick = () => openMessages({ email: targetEmail, name: targetName, picture: targetPic });
      actions.appendChild(b);
    } else if (data.status === 'outgoing') {
      actions.innerHTML = '<span class="text-sm text-gray-400">Friend request sent ✓</span>';
    } else if (data.status === 'incoming') {
      const b = document.createElement('button');
      b.className = 'rounded-full bg-[var(--color-primary)] px-5 py-2 text-sm font-bold';
      b.textContent = 'Accept request';
      b.onclick = async () => {
        await fetch('/api/friends/accept', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ me: me.email, requestId: data.requestId }) });
        loadFriendButton(); loadFriendsList();
      };
      actions.appendChild(b);
    } else {
      const b = document.createElement('button');
      b.className = 'rounded-full border border-gray-700 px-5 py-2 text-sm font-bold';
      b.textContent = '+ Add friend';
      b.onclick = async () => {
        b.disabled = true; b.textContent = 'Sending…';
        try {
          const resp = await fetch('/api/friends/request', {
            method:'POST', headers:{'content-type':'application/json'},
            body: JSON.stringify({ from: me.email, to: targetEmail })
          });
          const respData = await resp.json().catch(() => ({}));
          if (!resp.ok) alert('Could not send friend request: ' + (respData.error || `HTTP ${resp.status}`));
        } catch (err) { alert('Network error: ' + err.message); }
        loadFriendButton();
      };
      actions.appendChild(b);
    }
  } catch {
    actions.innerHTML = '<span class="text-sm text-red-400">Could not check friend status</span>';
  }
}

function switchToFindPeople() {
  document.getElementById('tabFindPeople')?.click();
}

function openMessages(friend) {
  if (!me) { alert('Sign in first'); return; }
  currentChatWith = friend;
  document.getElementById('messageDrawer').classList.remove('hidden');
  document.getElementById('msgWithName').textContent = friend.name || friend.email;
  document.getElementById('msgWithEmail').textContent = friend.email;
  loadMessages();
}
function closeMessages() {
  document.getElementById('messageDrawer').classList.add('hidden');
  currentChatWith = null;
}
async function loadMessages() {
  if (!currentChatWith || !me) return;
  const r = await fetch(`/api/messages?me=${encodeURIComponent(me.email)}&with=${encodeURIComponent(currentChatWith.email)}`);
  if (!r.ok) return;
  const msgs = await r.json();
  const list = document.getElementById('msgList');
  list.innerHTML = '';
  msgs.forEach(m => {
    const mine = m.sender === me.email;
    const div = document.createElement('div');
    div.className = `max-w-[80%] rounded-2xl px-3 py-2 ${mine ? 'ml-auto bg-[var(--color-primary)]' : 'bg-gray-800'}`;
    div.textContent = m.body;
    list.appendChild(div);
  });
  list.scrollTop = list.scrollHeight;
}
document.getElementById('msgForm').onsubmit = async (e) => {
  e.preventDefault();
  if (!currentChatWith || !me) return;
  const input = document.getElementById('msgInput');
  const body = input.value.trim();
  if (!body) return;
  input.value = '';
  await fetch('/api/messages', { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify({ from: me.email, to: currentChatWith.email, body }) });
  loadMessages();
};

function setTab(name) {
  ['videos', 'friends', 'findPeople'].forEach(t => {
    const el = document.getElementById('tab' + t.charAt(0).toUpperCase() + t.slice(1));
    const content = document.getElementById(t + 'Tab');
    if (!el || !content) return;
    if (t === name) {
      content.classList.remove('hidden');
      el.classList.add('border-[var(--color-primary)]');
      el.classList.remove('border-transparent', 'text-gray-400');
    } else {
      content.classList.add('hidden');
      el.classList.add('border-transparent', 'text-gray-400');
      el.classList.remove('border-[var(--color-primary)]');
    }
  });
  if (name === 'findPeople') loadFindPeople();
}

document.getElementById('tabVideos').onclick = () => setTab('videos');
document.getElementById('tabFriends').onclick = () => setTab('friends');
document.getElementById('tabFindPeople').onclick = () => setTab('findPeople');

let searchTimeout;
document.getElementById('findSearchInput').addEventListener('input', () => {
  clearTimeout(searchTimeout);
  searchTimeout = setTimeout(loadFindPeople, 300);
});

(async () => {
  await resolveTarget();
  document.getElementById('profileName').textContent = targetName || 'User';
  document.getElementById('profileEmail').textContent = targetEmail || (isOwnProfile ? 'Sign in to see your account' : '');
  document.getElementById('profilePic').src = targetPic || `https://ui-avatars.com/api/?name=${encodeURIComponent(targetName || 'U')}&background=random&color=fff&size=128`;

  // Show Find People tab only on own profile
  if (isOwnProfile && me) document.getElementById('tabFindPeople').classList.remove('hidden');

  loadProfileStats();
  loadFriendButton();
  loadFriendsList();
})();
</script>
</body>
</html>
